body{background:radial-gradient(circle at 72% 9%,rgba(21,77,126,.28),transparent 30%),radial-gradient(circle at 10% 24%,rgba(11,92,154,.2),transparent 30%),linear-gradient(160deg,#06111e 0%,#081a2b 48%,#0b2138 100%)!important}

header{margin:0 4px 12px!important;padding:4px 0 8px!important;border-bottom:1px solid rgba(112,188,242,.22)!important}.brand img{filter:drop-shadow(0 0 10px rgba(73,180,255,.32))}.brand h1{font-weight:780!important;letter-spacing:-.02em}.brand small{color:#8db8df!important}.core{position:relative!important;padding:9px 14px 9px 28px!important;border:1px solid rgba(83,255,150,.72)!important;background:linear-gradient(145deg,rgba(15,91,54,.78),rgba(7,55,37,.66))!important;color:#d7ffe5!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 18px rgba(52,255,128,.18)!important}.core:before{content:'';position:absolute;left:11px;top:50%;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;background:#58f27f;box-shadow:0 0 10px #58f27f}

.topnav button:before,.topnav a:before{position:absolute;z-index:2;left:50%;top:10px;transform:translateX(-50%);font-size:25px;line-height:1;color:#e9f5ff;filter:drop-shadow(0 1px 5px rgba(0,0,0,.7));font-weight:500}.topnav button:after,.topnav a:after{content:'';position:absolute;z-index:1;left:7%;right:7%;top:2px;height:36%;border-radius:16px 16px 42% 42%;background:linear-gradient(155deg,rgba(255,255,255,.32),rgba(255,255,255,.07) 58%,transparent);pointer-events:none}.topnav button[data-nav="jobs"]:before{content:'☑'}.topnav button[data-nav="route"]:before{content:'▱';font-size:28px;transform:translateX(-50%) rotate(-2deg)}.topnav button[data-nav="replies"]:before{content:'ϟ';font-size:34px;top:5px}.topnav button[data-nav="customers"]:before{content:'♟♟';font-size:18px;letter-spacing:-4px;top:13px}.topnav a:before{content:'●';font-size:25px;top:8px}.topnav a{padding-left:1px!important;padding-right:1px!important}.topnav button:active,.topnav a:active{transform:scale(.96)!important;filter:brightness(1.14)!important}.topnav .active{border-color:#4ce2ff!important;background:linear-gradient(180deg,rgba(46,158,255,.78) 0%,rgba(11,104,220,.8) 55%,rgba(4,73,167,.82) 100%)!important;color:#fff!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.62),inset 0 -10px 20px rgba(0,48,125,.25),0 0 0 1px rgba(52,205,255,.42),0 0 22px rgba(0,151,255,.72),0 8px 20px rgba(0,76,190,.42)!important}.topnav .active:before{color:#fff;filter:drop-shadow(0 0 8px rgba(76,226,255,.95)) drop-shadow(0 2px 4px rgba(0,0,0,.6))}
