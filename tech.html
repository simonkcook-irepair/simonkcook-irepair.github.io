<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="iRepair Tech">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=11">
<title>iRepair Technician</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf4ff;background:#07111f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#173a61 0,transparent 32%),linear-gradient(155deg,#07111f,#0c1b2c 55%,#10243b)}
button,input,textarea{font:inherit}.app{max-width:560px;margin:0 auto;min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 14px calc(88px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:55px;object-fit:contain}.brand h1{font-size:20px;margin:0}.brand small{display:block;color:#85a9cf;margin-top:2px}.chip{font-size:11px;font-weight:800;border-radius:99px;padding:7px 10px;background:#183552;border:1px solid #2a4d71;color:#a8c9eb}
.hero{padding:17px;border:1px solid #244766;background:linear-gradient(145deg,#112941e8,#0d2035e8);border-radius:24px;box-shadow:0 10px 28px #0005}.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.hero h2{font-size:28px;line-height:1.05;margin:3px 0 5px}.muted{color:#8daecc;font-size:12px;line-height:1.5}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.kpi{padding:11px;border-radius:16px;background:#0b1b2cf2;border:1px solid #21415f}.kpi strong{display:block;font-size:21px}.kpi span{font-size:10px;color:#88a8c7}
.toolbar{display:flex;gap:8px;margin:13px 0}.btn{border:0;border-radius:17px;min-height:44px;padding:10px 13px;background:linear-gradient(135deg,#57adff,#0b70dc);color:#fff;font-weight:800;box-shadow:0 5px 15px #0a5fae44}.btn.secondary{background:#152d45;color:#cde4fa;border:1px solid #31506d;box-shadow:none}.btn.danger{background:#4b2330}.toolbar .btn{flex:1}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}.section-title h3{margin:0;font-size:15px}.section-title span{font-size:11px;color:#7da0c2}
.job{border:1px solid #244663;background:linear-gradient(145deg,#10253a,#0b1c2e);border-radius:21px;padding:14px;margin:9px 0;box-shadow:0 8px 20px #0003}.job-head{display:flex;justify-content:space-between;gap:10px}.job h4{font-size:17px;margin:0 0 3px}.ref{font-size:10px;color:#6f94b7}.status{font-size:10px;font-weight:850;border-radius:99px;padding:7px 9px;white-space:nowrap;background:#183956;color:#b7d8f5;border:1px solid #2b5b83}.status.completed{background:#163d30;color:#c4f4d9;border-color:#2f6a53}.status.waiting_part{background:#483716;color:#ffe7ac;border-color:#755b24}.status.cancelled{background:#472331;color:#ffc6d8;border-color:#754054}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10px;border-radius:99px;padding:6px 8px;background:#0a1725;border:1px solid #203b55;color:#91b3d3}.job-actions{display:flex;gap:7px;margin-top:12px}.job-actions .btn{min-height:38px;padding:8px 10px;font-size:11px;flex:1}.price{font-size:20px;font-weight:900;color:#8bc6ff}.empty{padding:22px;text-align:center;border:1px dashed #34516d;border-radius:20px;color:#89a9c7}
.detail{margin-top:12px;border-top:1px solid #244560;padding-top:12px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{padding:10px;border-radius:14px;background:#0a1826;border:1px solid #1f3b54}.box strong{display:block;font-size:10px;color:#6f97bb;margin-bottom:4px}.box span{font-size:12px}.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.status-grid button{border:1px solid #2b4d6b;background:#102b43;color:#c7e1fa;border-radius:13px;padding:9px;font-size:11px;font-weight:800}.status-grid button.active{background:#176ebc;color:white;border-color:#3e9af0}textarea{width:100%;min-height:80px;border-radius:14px;border:1px solid #31516e;background:#081521;color:#edf7ff;padding:10px;margin-top:9px;resize:vertical}.notes{font-size:11px;color:#9dbbd6;margin-top:8px}.note{padding:8px 0;border-bottom:1px solid #1d354b}.note b{color:#d9edff}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#081522ed;border-top:1px solid #29445c;display:flex;gap:8px;backdrop-filter:blur(16px)}.bottom button,.bottom a{flex:1;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:10px 8px;background:#10273d;color:#9ec1e0;font-size:11px;font-weight:800}.bottom .active{background:#166ab6;color:#fff}
@media(min-width:700px){.app{padding-top:22px}.hero{margin-top:10px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><img src="/apple-touch-icon.png?v=11" alt="iRepair"><div><h1>iRepair Technician</h1><small>Prototype operations app</small></div></div><span class="chip">TECH</span></header>
<div id="main"></div>
</div>
<nav class="bottom"><button class="active" id="navJobs">Jobs</button><button id="navCustomers">Customers</button><a href="/" target="_blank">Customer app</a></nav>
<script src="/prototype-db.js?v=16"></script>
<script>
(function(){
const $=s=>document.querySelector(s);let selectedId=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function money(v){return typeof v==='number'?'£'+v.toFixed(2).replace('.00',''):'TBC'}
function counts(jobs){return {booked:jobs.filter(j=>['booked','confirmed'].includes(j.status)).length,active:jobs.filter(j=>['on_my_way','arrived','repairing','waiting_part'].includes(j.status)).length,done:jobs.filter(j=>j.status==='completed').length}}
function detail(j){if(!j||j.id!==selectedId)return '';return '<div class="detail"><div class="detail-grid"><div class="box"><strong>CUSTOMER</strong><span>'+esc(j.customerName)+'</span></div><div class="box"><strong>SERVICE</strong><span>'+esc(j.service)+'</span></div><div class="box"><strong>LOCATION</strong><span>'+esc([j.address,j.postcode].filter(Boolean).join(' · ')||'Not set')+'</span></div><div class="box"><strong>PART COMPATIBILITY</strong><span>'+esc(j.compatibility||'unknown')+'</span></div></div><div class="section-title"><h3>Update status</h3><span>Syncs to customer view</span></div><div class="status-grid">'+IRepairDB.STATUS.map(s=>'<button class="'+(j.status===s[0]?'active':'')+'" data-status="'+esc(s[0])+'" data-id="'+esc(j.id)+'">'+esc(s[1])+'</button>').join('')+'</div><div class="section-title"><h3>Technician notes</h3><span>Internal prototype</span></div><textarea id="noteText" placeholder="Add diagnosis, part requirement, colour, supplier note…"></textarea><button class="btn secondary" style="width:100%;margin-top:7px" data-save-note="'+esc(j.id)+'">Save note</button><div class="notes">'+((j.notes||[]).length?(j.notes||[]).slice().reverse().map(n=>'<div class="note"><b>'+esc(n.author)+'</b> · '+new Date(n.at).toLocaleString('en-GB')+'<br>'+esc(n.text)+'</div>').join(''):'No notes yet.')+'</div></div>'}
function jobCard(j){return '<article class="job"><div class="job-head"><div><h4>'+esc(j.device)+'</h4><div class="ref">'+esc(j.id)+' · '+esc(j.customerName)+'</div></div><div style="text-align:right"><div class="status '+esc(j.status)+'">'+esc(IRepairDB.label(j.status))+'</div><div class="price">'+money(j.price)+'</div></div></div><div class="meta"><span class="tag">'+esc(j.repair)+'</span><span class="tag">'+esc(j.service)+'</span>'+(j.postcode?'<span class="tag">'+esc(j.postcode)+'</span>':'')+(j.slot?'<span class="tag">'+esc(j.slot)+'</span>':'')+'</div><div class="job-actions"><button class="btn secondary" data-open="'+esc(j.id)+'">'+(selectedId===j.id?'Close':'Open job')+'</button><button class="btn" data-next="'+esc(j.id)+'">Next status →</button></div>'+detail(j)+'</article>'}
function render(){const jobs=IRepairDB.listJobs();const c=counts(jobs);$('#main').innerHTML='<section class="hero"><div class="hero-top"><div><div class="muted">TODAY · TECHNICIAN VIEW</div><h2>Repair operations</h2><div class="muted">Customer bookings and technician updates share the same prototype data layer.</div></div></div><div class="kpis"><div class="kpi"><strong>'+c.booked+'</strong><span>BOOKED</span></div><div class="kpi"><strong>'+c.active+'</strong><span>ACTIVE</span></div><div class="kpi"><strong>'+c.done+'</strong><span>COMPLETED</span></div></div></section><div class="toolbar"><button class="btn" id="addDemo">+ Demo booking</button><button class="btn secondary" id="resetDemo">Reset demo</button></div><div class="section-title"><h3>Job queue</h3><span>'+jobs.length+' repair'+(jobs.length===1?'':'s')+'</span></div>'+(jobs.length?jobs.map(jobCard).join(''):'<div class="empty">No repair jobs yet.<br>Create one in the customer app, or tap <b>Demo booking</b>.</div>')+'<p class="muted" style="text-align:center;margin:18px 8px">Prototype database is currently local to this browser. The production build will use the hosted iRepair Core API/database so customer and technician devices sync over the internet.</p>';bind()}
function nextStatus(j){const order=['booked','confirmed','on_my_way','arrived','repairing','completed'];let i=order.indexOf(j.status);return order[Math.min(order.length-1,Math.max(0,i+1))]}
function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selectedId=selectedId===b.dataset.open?null:b.dataset.open;render()});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{IRepairDB.setStatus(b.dataset.id,b.dataset.status,'technician');selectedId=b.dataset.id;render()});document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{const j=IRepairDB.getJob(b.dataset.next);if(j){IRepairDB.setStatus(j.id,nextStatus(j),'technician');selectedId=j.id;render()}});document.querySelectorAll('[data-save-note]').forEach(b=>b.onclick=()=>{const t=$('#noteText');if(t&&t.value.trim()){IRepairDB.addNote(b.dataset.saveNote,t.value,'Technician','technician');selectedId=b.dataset.saveNote;render()}});$('#addDemo').onclick=()=>{const j=IRepairDB.createDemoBooking();selectedId=j.id;render()};$('#resetDemo').onclick=()=>{if(confirm('Clear all prototype repair jobs?')){selectedId=null;IRepairDB.clear();render()}}}
IRepairDB.subscribe(()=>render());render();
})();
</script>
</body>
</html>
