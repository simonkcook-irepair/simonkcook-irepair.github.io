<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iRepair Tech">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=11">
<title>iRepair Technician</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf4ff;background:#07111f}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#173a61 0,transparent 32%),linear-gradient(155deg,#07111f,#0c1b2c 55%,#10243b)}button,input,textarea{font:inherit}.app{max-width:590px;margin:0 auto;min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:55px;object-fit:contain}.brand h1{font-size:20px;margin:0}.brand small{display:block;color:#85a9cf;margin-top:2px}.chip{font-size:10px;font-weight:850;border-radius:99px;padding:7px 10px;background:#183552;border:1px solid #2a4d71;color:#a8c9eb}
.hero{padding:17px;border:1px solid #244766;background:linear-gradient(145deg,#112941e8,#0d2035e8);border-radius:24px;box-shadow:0 10px 28px #0005}.hero h2{font-size:28px;line-height:1.05;margin:3px 0 5px}.muted{color:#8daecc;font-size:12px;line-height:1.5}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.kpi{padding:10px 8px;border-radius:15px;background:#0b1b2cf2;border:1px solid #21415f}.kpi strong{display:block;font-size:19px}.kpi span{font-size:9px;color:#88a8c7}.toolbar{display:flex;gap:8px;margin:13px 0}.btn{border:0;border-radius:17px;min-height:44px;padding:10px 13px;background:linear-gradient(135deg,#57adff,#0b70dc);color:#fff;font-weight:800;box-shadow:0 5px 15px #0a5fae44}.btn.secondary{background:#152d45;color:#cde4fa;border:1px solid #31506d;box-shadow:none}.btn.ghost{background:transparent;border:1px solid #29465f;color:#9fc2e2;box-shadow:none}.btn:disabled{opacity:.4}.toolbar .btn{flex:1}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}.section-title h3{margin:0;font-size:15px}.section-title span{font-size:11px;color:#7da0c2}
.filters{display:flex;gap:7px;overflow:auto;padding:1px 1px 5px}.filter{white-space:nowrap;border:1px solid #294864;background:#0d2134;color:#89add0;border-radius:99px;padding:8px 11px;font-size:10px;font-weight:800}.filter.active{background:#166ab6;color:#fff;border-color:#3b8ed3}.job{border:1px solid #244663;background:linear-gradient(145deg,#10253a,#0b1c2e);border-radius:21px;padding:14px;margin:9px 0;box-shadow:0 8px 20px #0003}.job.high{border-color:#765929}.job-head{display:flex;justify-content:space-between;gap:10px}.job h4{font-size:17px;margin:0 0 3px}.ref{font-size:10px;color:#6f94b7}.status{font-size:10px;font-weight:850;border-radius:99px;padding:7px 9px;white-space:nowrap;background:#183956;color:#b7d8f5;border:1px solid #2b5b83}.status.completed{background:#163d30;color:#c4f4d9;border-color:#2f6a53}.status.waiting_part{background:#483716;color:#ffe7ac;border-color:#755b24}.status.cancelled{background:#472331;color:#ffc6d8;border-color:#754054}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10px;border-radius:99px;padding:6px 8px;background:#0a1725;border:1px solid #203b55;color:#91b3d3}.tag.good{border-color:#2e644f;color:#bce9cf}.tag.warn{border-color:#715a2b;color:#f5d99f}.tag.due{border-color:#744356;color:#f2bfd0}.job-actions{display:flex;gap:7px;margin-top:12px}.job-actions .btn{min-height:38px;padding:8px 10px;font-size:11px;flex:1}.price{font-size:20px;font-weight:900;color:#8bc6ff}.empty{padding:22px;text-align:center;border:1px dashed #34516d;border-radius:20px;color:#89a9c7}.detail{margin-top:12px;border-top:1px solid #244560;padding-top:12px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{padding:10px;border-radius:14px;background:#0a1826;border:1px solid #1f3b54}.box strong{display:block;font-size:9px;color:#6f97bb;margin-bottom:4px}.box span{font-size:12px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.quick a,.quick button{border:1px solid #2c4a64;background:#0c2133;color:#b5d4ee;border-radius:13px;padding:10px 5px;text-align:center;text-decoration:none;font-size:10px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.grid button{border:1px solid #2b4d6b;background:#102b43;color:#c7e1fa;border-radius:13px;padding:9px;font-size:10px;font-weight:800}.grid button.active{background:#176ebc;color:white;border-color:#3e9af0}.grid.parts button.active{background:#76551a;border-color:#b58a38}.grid.pay button.active{background:#246242;border-color:#4b9b70}.field{width:100%;min-height:72px;border-radius:14px;border:1px solid #31516e;background:#081521;color:#edf7ff;padding:10px;margin-top:8px;resize:vertical}.notes,.timeline{font-size:11px;color:#9dbbd6;margin-top:8px}.note,.event{padding:8px 0;border-bottom:1px solid #1d354b}.note b,.event b{color:#d9edff}.customer-msg{padding:10px;border-radius:14px;background:#102b43;border:1px solid #2e5778;color:#cae5fc;font-size:11px;margin-top:8px}
.route-card,.customer-card{border:1px solid #244663;background:#0d2134;border-radius:18px;padding:13px;margin:9px 0}.route-num{width:29px;height:29px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#176ebc;font-weight:900;margin-right:8px}.route-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.route-card a{color:#8ec9ff;text-decoration:none;font-size:11px;font-weight:800}.customer-card strong{font-size:15px}.customer-card .small{font-size:10px;color:#81a5c5;margin-top:4px}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(590px,100%);padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#081522ed;border-top:1px solid #29445c;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;backdrop-filter:blur(16px)}.bottom button,.bottom a{text-align:center;text-decoration:none;border:0;border-radius:13px;padding:10px 4px;background:#10273d;color:#9ec1e0;font-size:10px;font-weight:800}.bottom .active{background:#166ab6;color:#fff}
@media(min-width:700px){.app{padding-top:22px}.hero{margin-top:10px}}
</style>
</head>
<body><div class="app"><header><div class="brand"><img src="/apple-touch-icon.png?v=11" alt="iRepair"><div><h1>iRepair Technician</h1><small>Operations prototype · Build 17</small></div></div><span class="chip">TECH</span></header><div id="main"></div></div>
<nav class="bottom"><button class="active" data-nav="jobs">Jobs</button><button data-nav="route">Route</button><button data-nav="customers">Customers</button><a href="/" target="_blank">Customer</a></nav>
<script src="/prototype-db.js?v=17"></script>
<script>
(function(){
const $=s=>document.querySelector(s);let selectedId=null,view='jobs',filter='all';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>typeof v==='number'?'£'+v.toFixed(2).replace('.00',''):'TBC';
function visibleJobs(){let a=IRepairDB.listJobs();if(filter==='now')a=a.filter(j=>['booked','confirmed','on_my_way','arrived','repairing'].includes(j.status));if(filter==='waiting')a=a.filter(j=>j.status==='waiting_part'||['order_required','ordered'].includes(j.partState));if(filter==='done')a=a.filter(j=>j.status==='completed');return a}
function counts(j){return {booked:j.filter(x=>['booked','confirmed'].includes(x.status)).length,active:j.filter(x=>['on_my_way','arrived','repairing','waiting_part'].includes(x.status)).length,done:j.filter(x=>x.status==='completed').length,due:j.filter(x=>x.paymentState!=='paid'&&x.status!=='cancelled').length}}
function hero(j){const c=counts(j);return '<section class="hero"><div class="muted">TODAY · TECHNICIAN VIEW</div><h2>Repair operations</h2><div class="muted">One shared repair record drives customer updates, parts, payment and technician workflow.</div><div class="kpis"><div class="kpi"><strong>'+c.booked+'</strong><span>BOOKED</span></div><div class="kpi"><strong>'+c.active+'</strong><span>ACTIVE</span></div><div class="kpi"><strong>'+c.done+'</strong><span>DONE</span></div><div class="kpi"><strong>'+c.due+'</strong><span>PAYMENT DUE</span></div></div></section>'}
function nextStatus(j){const o=['booked','confirmed','on_my_way','arrived','repairing','completed'];let i=o.indexOf(j.status);return o[Math.min(o.length-1,Math.max(0,i+1))]}
function tags(j){return '<div class="meta"><span class="tag">'+esc(j.repair)+'</span><span class="tag">'+esc(j.service)+'</span>'+(j.postcode?'<span class="tag">'+esc(j.postcode)+'</span>':'')+(j.slot?'<span class="tag">'+esc(j.slot)+'</span>':'')+'<span class="tag '+(j.partState==='in_stock'||j.partState==='fitted'?'good':j.partState==='not_checked'?'':'warn')+'">Part: '+esc(IRepairDB.partLabel(j.partState))+'</span><span class="tag '+(j.paymentState==='paid'?'good':'due')+'">'+esc(IRepairDB.paymentLabel(j.paymentState))+'</span></div>'}
function detail(j){if(!j||j.id!==selectedId)return '';const loc=[j.address,j.postcode].filter(Boolean).join(', ');const map=loc?'https://maps.apple.com/?q='+encodeURIComponent(loc):'';return '<div class="detail"><div class="detail-grid"><div class="box"><strong>CUSTOMER</strong><span>'+esc(j.customerName)+'</span></div><div class="box"><strong>DEVICE</strong><span>'+esc(j.device)+'</span></div><div class="box"><strong>LOCATION</strong><span>'+esc(loc||'Not set')+'</span></div><div class="box"><strong>COMPATIBILITY</strong><span>'+esc(j.compatibility||'unknown')+'</span></div></div><div class="quick">'+(j.phone?'<a href="tel:'+esc(j.phone)+'">Call</a><a href="sms:'+esc(j.phone)+'">Text</a>':'<button disabled>Call</button><button disabled>Text</button>')+(map?'<a href="'+map+'" target="_blank">Navigate</a>':'<button disabled>Navigate</button>')+'</div><div class="section-title"><h3>Repair status</h3><span>Customer sees this</span></div><div class="grid">'+IRepairDB.STATUS.map(s=>'<button class="'+(j.status===s[0]?'active':'')+'" data-status="'+esc(s[0])+'" data-id="'+esc(j.id)+'">'+esc(s[1])+'</button>').join('')+'</div><div class="section-title"><h3>Part / stock</h3><span>Internal control</span></div><div class="grid parts">'+IRepairDB.PART_STATES.map(s=>'<button class="'+(j.partState===s[0]?'active':'')+'" data-part="'+esc(s[0])+'" data-id="'+esc(j.id)+'">'+esc(s[1])+'</button>').join('')+'</div><div class="section-title"><h3>Payment</h3><span>'+money(j.price)+'</span></div><div class="grid pay">'+IRepairDB.PAYMENT_STATES.map(s=>'<button class="'+(j.paymentState===s[0]?'active':'')+'" data-pay="'+esc(s[0])+'" data-id="'+esc(j.id)+'">'+esc(s[1])+'</button>').join('')+'</div><div class="section-title"><h3>Customer update</h3><span>Visible in customer app</span></div>'+(j.customerMessage?'<div class="customer-msg">Latest: '+esc(j.customerMessage)+'</div>':'')+'<textarea class="field" id="customerMessage" placeholder="e.g. I have the part with me and I’m heading over now."></textarea><button class="btn" style="width:100%;margin-top:7px" data-customer-message="'+esc(j.id)+'">Save customer update</button><div class="section-title"><h3>Technician note</h3><span>Internal only</span></div><textarea class="field" id="noteText" placeholder="Diagnosis, colour, supplier, serial/model check, repair observations…"></textarea><button class="btn secondary" style="width:100%;margin-top:7px" data-save-note="'+esc(j.id)+'">Save internal note</button><div class="notes">'+((j.notes||[]).length?(j.notes||[]).slice().reverse().map(n=>'<div class="note"><b>'+esc(n.author)+'</b> · '+new Date(n.at).toLocaleString('en-GB')+'<br>'+esc(n.text)+'</div>').join(''):'No internal notes yet.')+'</div><div class="section-title"><h3>Shared timeline</h3><span>Database events</span></div><div class="timeline">'+((j.timeline||[]).slice().reverse().slice(0,8).map(e=>'<div class="event"><b>'+esc(e.label)+'</b><br>'+esc(e.actor)+' · '+new Date(e.at).toLocaleString('en-GB')+(e.visibility==='internal'?' · internal':'')+'</div>').join('')||'No events yet.')+'</div></div>'}
function jobCard(j){return '<article class="job '+(j.priority==='high'?'high':'')+'"><div class="job-head"><div><h4>'+esc(j.device)+'</h4><div class="ref">'+esc(j.id)+' · '+esc(j.customerName)+(j.priority==='high'?' · HIGH PRIORITY':'')+'</div></div><div style="text-align:right"><div class="status '+esc(j.status)+'">'+esc(IRepairDB.label(j.status))+'</div><div class="price">'+money(j.price)+'</div></div></div>'+tags(j)+'<div class="job-actions"><button class="btn secondary" data-open="'+esc(j.id)+'">'+(selectedId===j.id?'Close':'Open job')+'</button><button class="btn" data-next="'+esc(j.id)+'">Next status →</button></div>'+detail(j)+'</article>'}
function jobsView(){const all=IRepairDB.listJobs(),jobs=visibleJobs();return hero(all)+'<div class="toolbar"><button class="btn" id="seedDay">+ Demo day</button><button class="btn secondary" id="addDemo">+ One booking</button></div><div class="filters">'+[['all','All'],['now','Needs action'],['waiting','Parts'],['done','Completed']].map(f=>'<button class="filter '+(filter===f[0]?'active':'')+'" data-filter="'+f[0]+'">'+f[1]+'</button>').join('')+'</div><div class="section-title"><h3>Job queue</h3><span>'+jobs.length+' shown</span></div>'+(jobs.length?jobs.map(jobCard).join(''):'<div class="empty">Nothing in this view.</div>')+'<button class="btn ghost" style="width:100%;margin-top:14px" id="resetDemo">Clear prototype data</button><p class="muted" style="text-align:center;margin:18px 8px">Build 17 still uses a browser-local database adapter. The UI contract is designed so the adapter can later be replaced by the hosted iRepair Core API.</p>'}
function routeView(){const jobs=IRepairDB.listJobs().filter(j=>j.status!=='completed'&&j.status!=='cancelled'&&/mobile/i.test(j.service));jobs.sort((a,b)=>String(a.slot||'').localeCompare(String(b.slot||'')));return hero(IRepairDB.listJobs())+'<div class="section-title"><h3>Today’s mobile route</h3><span>'+jobs.length+' stops</span></div>'+(jobs.length?jobs.map((j,i)=>{const loc=[j.address,j.postcode].filter(Boolean).join(', ');return '<div class="route-card"><div class="route-row"><div><span class="route-num">'+(i+1)+'</span><strong>'+esc(j.customerName)+'</strong></div><span class="status '+esc(j.status)+'">'+esc(IRepairDB.label(j.status))+'</span></div><div class="muted" style="margin:8px 0">'+esc(j.device)+' · '+esc(j.repair)+'<br>'+esc(j.slot||'Time TBC')+' · '+esc(loc||'Location TBC')+'</div>'+(loc?'<a href="https://maps.apple.com/?q='+encodeURIComponent(loc)+'" target="_blank">Open navigation →</a>':'')+'</div>'}).join(''):'<div class="empty">No active mobile jobs.</div>')}
function customersView(){const jobs=IRepairDB.listJobs(),map={};jobs.forEach(j=>{const k=j.customerName||'Unknown';if(!map[k])map[k]={name:k,jobs:0,spent:0,devices:new Set(),last:''};const c=map[k];c.jobs++;if(j.status==='completed'&&typeof j.price==='number')c.spent+=j.price;c.devices.add(j.device);if(!c.last||j.updatedAt>c.last)c.last=j.updatedAt});const cs=Object.values(map).sort((a,b)=>b.last.localeCompare(a.last));return hero(jobs)+'<div class="section-title"><h3>Prototype customers</h3><span>'+cs.length+' people</span></div>'+(cs.length?cs.map(c=>'<div class="customer-card"><strong>'+esc(c.name)+'</strong><div class="small">'+c.jobs+' repair'+(c.jobs===1?'':'s')+' · '+c.devices.size+' device'+(c.devices.size===1?'':'s')+' · completed spend '+money(c.spent)+'</div></div>').join(''):'<div class="empty">Customer records will appear from repair bookings.</div>')}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));$('#main').innerHTML=view==='route'?routeView():view==='customers'?customersView():jobsView();bind()}
function bind(){document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;selectedId=null;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selectedId=selectedId===b.dataset.open?null:b.dataset.open;render()});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{IRepairDB.setStatus(b.dataset.id,b.dataset.status,'technician');selectedId=b.dataset.id;render()});document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{IRepairDB.setPartState(b.dataset.id,b.dataset.part,'technician');selectedId=b.dataset.id;render()});document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{IRepairDB.setPaymentState(b.dataset.id,b.dataset.pay,'technician');selectedId=b.dataset.id;render()});document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{const j=IRepairDB.getJob(b.dataset.next);if(j){IRepairDB.setStatus(j.id,nextStatus(j),'technician');selectedId=j.id;render()}});document.querySelectorAll('[data-save-note]').forEach(b=>b.onclick=()=>{const t=$('#noteText');if(t&&t.value.trim()){IRepairDB.addNote(b.dataset.saveNote,t.value,'Technician','technician');selectedId=b.dataset.saveNote;render()}});document.querySelectorAll('[data-customer-message]').forEach(b=>b.onclick=()=>{const t=$('#customerMessage');if(t&&t.value.trim()){IRepairDB.setCustomerMessage(b.dataset.customerMessage,t.value,'technician');selectedId=b.dataset.customerMessage;render()}});const sd=$('#seedDay');if(sd)sd.onclick=()=>{IRepairDB.createDemoDay();render()};const ad=$('#addDemo');if(ad)ad.onclick=()=>{const j=IRepairDB.createDemoBooking();selectedId=j.id;render()};const rd=$('#resetDemo');if(rd)rd.onclick=()=>{if(confirm('Clear all prototype repair data?')){selectedId=null;IRepairDB.clear();render()}}}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;selectedId=null;render()});IRepairDB.subscribe(()=>render());render();
})();
</script></body></html>
