<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2238"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="iRepair Tech">

<style>
/* Build 26: deliberately roomy, glass-style technician navigation. Inline to beat stale iOS/PWA CSS. */
.topnav{position:sticky!important;z-index:100!important;top:calc(6px + env(safe-area-inset-top))!important;width:100%!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;align-items:stretch!important;column-gap:10px!important;row-gap:0!important;margin:0 0 18px!important;padding:10px!important;border:1px solid rgba(125,190,240,.26)!important;border-radius:22px!important;background:linear-gradient(145deg,rgba(15,40,65,.68),rgba(5,20,35,.54))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 30px rgba(0,0,0,.28)!important;backdrop-filter:blur(22px) saturate(145%)!important;-webkit-backdrop-filter:blur(22px) saturate(145%)!important}
.topnav button,.topnav a{box-sizing:border-box!important;width:100%!important;min-width:0!important;min-height:58px!important;margin:0!important;padding:9px 3px!important;border:1px solid rgba(159,211,250,.42)!important;border-radius:18px!important;background:linear-gradient(155deg,rgba(74,113,149,.34),rgba(19,48,75,.22))!important;color:#d8eaff!important;text-decoration:none!important;text-align:center!important;font-size:9px!important;font-weight:800!important;line-height:1.12!important;display:flex!important;align-items:center!important;justify-content:center!important;white-space:normal!important;overflow:hidden!important;text-shadow:0 1px 5px rgba(0,0,0,.55)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.2),0 5px 14px rgba(0,0,0,.24)!important;backdrop-filter:blur(16px) saturate(150%)!important;-webkit-backdrop-filter:blur(16px) saturate(150%)!important;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease!important}
.topnav button:active,.topnav a:active{transform:scale(.96)!important}
.topnav .active{border-color:rgba(82,205,255,.95)!important;background:linear-gradient(150deg,rgba(47,154,255,.76),rgba(9,83,178,.58))!important;color:#fff!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 0 0 1px rgba(40,186,255,.32),0 7px 22px rgba(0,128,255,.36)!important}
@media(max-width:390px){.topnav{column-gap:7px!important;padding:8px!important}.topnav button,.topnav a{font-size:8px!important;min-height:55px!important;border-radius:16px!important}}
</style>
</head>
<body>
<div class="app"><header><div class="brand"><img src="/apple-touch-icon.png?v=11" alt="iRepair"><div><h1>iRepair Technician</h1><small>Operations prototype · Build 26</small></div></div><span id="coreChip" class="core">CORE SYNC</span></header><nav class="topnav"><button class="active" data-nav="jobs">Jobs</button><button data-nav="route">Route</button><button data-nav="replies">⚡ Replies</button><button data-nav="customers">Customers</button><a href="/">Customer</a></nav><main id="main"></main></div>
<script src="/prototype-db.js?v=22"></script>
<script src="/quick-replies.js?v=1"></script>
<script src="/tech-core.js?v=23"></script>
</body>
</html>
