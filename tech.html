<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iRepair Tech">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=11">
<title>iRepair Technician</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef7ff;background:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#173a61 0,transparent 32%),linear-gradient(155deg,#07111f,#0b1b2b 58%,#10243b)}button,input,textarea{font:inherit}.app{max-width:620px;margin:0 auto;min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.brand{display:flex;gap:10px;align-items:center}.brand img{width:40px;height:54px;object-fit:contain}.brand h1{font-size:20px;margin:0}.brand small{display:block;color:#86a9c9;margin-top:2px}.core{border-radius:99px;padding:7px 10px;font-size:10px;font-weight:850;border:1px solid #72562a;background:#453316;color:#ffdda3}.core.online{border-color:#34745a;background:#153b2e;color:#c8f2da}.hero,.job,.panel{border:1px solid #264761;background:linear-gradient(145deg,#10273d,#0b1c2e);border-radius:22px;box-shadow:0 8px 24px #0003}.hero{padding:17px}.eyebrow{font-size:10px;color:#7fa3c5;font-weight:850;letter-spacing:.06em}.hero h2{font-size:28px;margin:4px 0 6px}.muted{font-size:11px;line-height:1.5;color:#8dadca}.sync{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;padding:10px;border-radius:14px;background:#081827;border:1px solid #23425e;font-size:10px;color:#a9c7e1}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#b88937;margin-right:6px}.dot.online{background:#45b47a}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.kpi{padding:10px 7px;border-radius:14px;background:#081827;border:1px solid #203e58}.kpi strong{display:block;font-size:19px}.kpi span{font-size:8px;color:#7fa2c1}.toolbar{display:flex;gap:7px;margin:12px 0}.btn{border:0;border-radius:15px;min-height:43px;padding:9px 11px;background:linear-gradient(135deg,#58afff,#0b70dc);color:white;font-weight:850;font-size:11px}.btn.secondary{background:#132b42;border:1px solid #31516d;color:#cbe3f7}.btn.ghost{background:transparent;border:1px solid #294863;color:#9fc1de}.toolbar .btn{flex:1}.filters{display:flex;gap:6px;overflow:auto;padding-bottom:4px}.filter{white-space:nowrap;border:1px solid #294863;background:#0d2134;color:#8eafd0;border-radius:99px;padding:8px 10px;font-size:10px;font-weight:800}.filter.active{background:#176ab6;color:white;border-color:#3d8fd5}.section{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 8px}.section h3{font-size:15px;margin:0}.section span{font-size:10px;color:#7d9fbd}.job{padding:14px;margin:9px 0}.jobhead{display:flex;justify-content:space-between;gap:10px}.job h4{font-size:17px;margin:0 0 3px}.ref{font-size:10px;color:#6e93b4}.price{font-size:19px;font-weight:900;color:#8bc7ff}.status{display:inline-block;font-size:9px;font-weight:850;border-radius:99px;padding:6px 8px;background:#173752;border:1px solid #2d587e;color:#b6d7f3}.status.completed{background:#153b2d;border-color:#2f6a51;color:#c5f0d7}.status.waiting_part{background:#493617;border-color:#755a25;color:#ffe1a9}.status.cancelled{background:#46222e;border-color:#714052;color:#ffc4d5}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.tag{font-size:9px;border-radius:99px;padding:5px 7px;background:#081624;border:1px solid #1f3b54;color:#91b3d1}.tag.good{border-color:#2d614d;color:#bbe8cd}.tag.warn{border-color:#6d572c;color:#efd497}.tag.due{border-color:#6c4052;color:#efbdcd}.actions{display:flex;gap:7px;margin-top:11px}.actions .btn{flex:1;min-height:37px}.detail{border-top:1px solid #23425d;margin-top:12px;padding-top:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.box{padding:9px;border:1px solid #1f3b55;background:#081827;border-radius:13px}.box strong{display:block;font-size:8px;color:#7397b8;margin-bottom:3px}.box span{font-size:11px}.chooser{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chooser button{border:1px solid #2b4c68;background:#102941;color:#c7e0f6;border-radius:12px;padding:9px 6px;font-size:10px;font-weight:800}.chooser button.active{background:#176ebc;color:white;border-color:#4199e6}.chooser.parts button.active{background:#75551c;border-color:#aa7d30}.chooser.pay button.active{background:#245f41;border-color:#478f69}.field{width:100%;border-radius:13px;border:1px solid #31516e;background:#071522;color:#eef8ff;padding:10px;margin-top:7px}.field.text{min-height:70px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.timeline{font-size:10px;color:#98b7d1}.event{border-bottom:1px solid #1d354a;padding:7px 0}.event b{color:#dbedfb}.route,.customer{padding:13px;border-radius:17px;background:#0d2134;border:1px solid #25455f;margin:8px 0}.route-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.route-num{display:inline-flex;width:27px;height:27px;align-items:center;justify-content:center;border-radius:50%;background:#176ab6;font-weight:900;margin-right:7px}.route a{color:#8bc7ff;text-decoration:none;font-size:10px;font-weight:800}.empty{padding:22px;text-align:center;border:1px dashed #35516c;border-radius:18px;color:#88a8c5}.workflow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px}.workflow-step{min-height:52px;border-radius:13px;border:1px solid #294962;background:#0a1a29;padding:9px 10px;display:flex;gap:8px;align-items:center;color:#7f9db7}.workflow-mark{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #38566f;background:#10283c;color:#7899b5;font-size:11px;font-weight:900}.workflow-step b{display:block;font-size:10px;color:#9db8cf;line-height:1.25}.workflow-step small{display:block;font-size:8px;color:#67859f;margin-top:2px}.workflow-step.done{background:#12382b;border-color:#347659;color:#c8f1d9}.workflow-step.done .workflow-mark{background:#2d855d;border-color:#58aa7f;color:white}.workflow-step.done b{color:#d9f6e5}.workflow-step.done small{color:#9fd6b7}.workflow-step.skipped{border-style:dashed;opacity:.72}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(620px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#081522ec;border-top:1px solid #29445c;backdrop-filter:blur(16px)}.bottom button,.bottom a{border:0;border-radius:12px;padding:10px 4px;background:#10273c;color:#9dbfdd;text-decoration:none;text-align:center;font-size:10px;font-weight:850}.bottom .active{background:#176ab6;color:white}@media(min-width:520px){.workflow{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body><div class="app"><header><div class="brand"><img src="/apple-touch-icon.png?v=11" alt="iRepair"><div><h1>iRepair Technician</h1><small>Operations prototype · Build 20</small></div></div><span id="coreChip" class="core">CORE SYNC</span></header><main id="main"></main></div>
<nav class="bottom"><button class="active" data-nav="jobs">Jobs</button><button data-nav="route">Route</button><button data-nav="customers">Customers</button><a href="/">Customer</a></nav>
<script src="/prototype-db.js?v=20"></script>
<script>
(function(){
const $=s=>document.querySelector(s);let view='jobs',selected=null,filter='all';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>typeof v==='number'?'£'+v.toFixed(2).replace('.00',''):'TBC';
function online(){return !!(IRepairDB.connection&&IRepairDB.connection.online)}
function coreChip(){const c=$('#coreChip');if(!c)return;c.textContent=online()?'CORE ONLINE':'CORE SYNC';c.classList.toggle('online',online())}
function counts(j){return{booked:j.filter(x=>['booked','confirmed'].includes(x.status)).length,active:j.filter(x=>['on_my_way','arrived','repairing','waiting_part'].includes(x.status)).length,done:j.filter(x=>x.status==='completed').length,due:j.filter(x=>x.paymentState!=='paid'&&x.status!=='cancelled').length}}
function hero(){const jobs=IRepairDB.listJobs(),c=counts(jobs),cn=IRepairDB.connection||{};return '<section class="hero"><div class="eyebrow">TODAY · TECHNICIAN VIEW</div><h2>Repair operations</h2><div class="muted">Customer and technician apps are sharing the Supabase-backed iRepair Core database.</div><div class="sync"><span><i class="dot '+(online()?'online':'')+'"></i><b>'+(online()?'Shared Core online':'Local cache / reconnecting')+'</b></span><span>'+(online()&&cn.lastSuccess?'Synced '+new Date(cn.lastSuccess).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'Auto-sync every few seconds')+'</span></div><div class="kpis"><div class="kpi"><strong>'+c.booked+'</strong><span>BOOKED</span></div><div class="kpi"><strong>'+c.active+'</strong><span>ACTIVE</span></div><div class="kpi"><strong>'+c.done+'</strong><span>DONE</span></div><div class="kpi"><strong>'+c.due+'</strong><span>PAYMENT DUE</span></div></div></section>'}
function visible(){let a=IRepairDB.listJobs();if(filter==='action')a=a.filter(j=>!['completed','cancelled'].includes(j.status));if(filter==='parts')a=a.filter(j=>j.status==='waiting_part'||['order_required','ordered'].includes(j.partState));if(filter==='done')a=a.filter(j=>j.status==='completed');return a}
function nextStatus(j){const o=['booked','confirmed','on_my_way','arrived','repairing','completed'];let i=o.indexOf(j.status);return o[Math.min(o.length-1,Math.max(0,i+1))]}
function buttons(list,current,attr,cls){return '<div class="chooser '+(cls||'')+'">'+list.map(x=>'<button class="'+(x[0]===current?'active':'')+'" '+attr+'="'+esc(x[0])+'">'+esc(x[1])+'</button>').join('')+'</div>'}
function workflow(j){
  const history=(j.timeline||[]).map(e=>String(e.label||'').toLowerCase()).join(' | ');
  const seen=t=>history.includes(String(t).toLowerCase());
  const rank={booked:0,confirmed:1,waiting_part:1,on_my_way:2,arrived:3,repairing:4,completed:5,cancelled:-1};
  const at=s=>(rank[j.status]??-1)>=(rank[s]??99)||seen(IRepairDB.label(s));
  const orderNeeded=['order_required','ordered','received'].includes(j.partState)||seen('order required');
  const ordered=['ordered','received'].includes(j.partState)||seen('ordered');
  const stocked=['in_stock','received','fitted'].includes(j.partState)||seen('in stock')||seen('received')||seen('fitted');
  const orderSkipped=stocked&&!orderNeeded&&!ordered;
  const steps=[
    ['Customer booked',true,'Repair request received'],
    ['Booking confirmed',at('confirmed'),''],
    ['Part needs ordering',orderNeeded,orderSkipped?'Not needed':''],
    ['Part ordered',ordered,orderSkipped?'Not needed':''],
    ['Part in stock',stocked,''],
    ['Technician on way',at('on_my_way'),''],
    ['Arrived',at('arrived'),''],
    ['Repairing',at('repairing'),''],
    ['Repair complete',at('completed'),''],
    ['Payment complete',j.paymentState==='paid','']
  ];
  return '<div class="section"><h3>Workflow at a glance</h3><span>Green = completed</span></div><div class="workflow">'+steps.map(s=>'<div class="workflow-step '+(s[1]?'done':s[2]?'skipped':'')+'"><span class="workflow-mark">'+(s[1]?'✓':'·')+'</span><span><b>'+esc(s[0])+'</b>'+(s[2]?'<small>'+esc(s[2])+'</small>':'')+'</span></div>').join('')+'</div>';
}
function detail(j){if(selected!==j.id)return '';const loc=[j.address,j.postcode].filter(Boolean).join(', '),map=loc?'https://maps.apple.com/?q='+encodeURIComponent(loc):'';return '<div class="detail"><div class="grid2"><div class="box"><strong>CUSTOMER</strong><span>'+esc(j.customerName)+'</span></div><div class="box"><strong>DEVICE</strong><span>'+esc(j.device)+(j.variant?'<br>'+esc(j.variant):'')+'</span></div><div class="box"><strong>LOCATION</strong><span>'+esc(loc||'Not set')+'</span></div><div class="box"><strong>COMPATIBILITY</strong><span>'+esc(j.compatibility)+'</span></div></div>'+workflow(j)+'<div class="toolbar">'+(j.phone?'<a class="btn secondary" href="tel:'+esc(j.phone)+'">Call</a>':'')+(map?'<a class="btn secondary" href="'+map+'" target="_blank">Navigate</a>':'')+'</div><div class="section"><h3>Repair status</h3><span>Customer sees this</span></div>'+buttons(IRepairDB.STATUS,j.status,'data-status','')+'<div class="section"><h3>Part / stock</h3><span>Internal</span></div>'+buttons(IRepairDB.PART_STATES,j.partState,'data-part','parts')+'<div class="two"><input class="field" id="partName" value="'+esc(j.partName||'')+'" placeholder="Part / colour"><input class="field" id="supplier" value="'+esc(j.supplier||'')+'" placeholder="Supplier"></div><button class="btn secondary" style="width:100%;margin-top:7px" data-partinfo="'+esc(j.id)+'">Save part details</button><div class="section"><h3>Payment</h3><span>'+money(j.price)+'</span></div>'+buttons(IRepairDB.PAYMENT_STATES,j.paymentState,'data-pay','pay')+'<div class="section"><h3>Customer update</h3><span>Visible to customer</span></div>'+(j.customerMessage?'<div class="box"><span>'+esc(j.customerMessage)+'</span></div>':'')+'<textarea class="field text" id="customerMessage" placeholder="e.g. I have the part and I’m on my way."></textarea><button class="btn" style="width:100%;margin-top:7px" data-customer="'+esc(j.id)+'">Send/save update</button><div class="section"><h3>Technician note</h3><span>Internal only</span></div><textarea class="field text" id="noteText" placeholder="Diagnosis, colour, supplier, repair observations…"></textarea><button class="btn secondary" style="width:100%;margin-top:7px" data-note="'+esc(j.id)+'">Save internal note</button><div class="section"><h3>Timeline</h3><span>Core events</span></div><div class="timeline">'+((j.timeline||[]).slice().reverse().slice(0,10).map(e=>'<div class="event"><b>'+esc(e.label)+'</b><br>'+esc(e.actor)+' · '+new Date(e.at).toLocaleString('en-GB')+(e.visibility==='internal'?' · internal':'')+'</div>').join('')||'No events yet.')+'</div></div>'}
function card(j){return '<article class="job"><div class="jobhead"><div><h4>'+esc(j.device)+'</h4><div class="ref">'+esc(j.id)+' · '+esc(j.customerName)+'</div></div><div style="text-align:right"><span class="status '+esc(j.status)+'">'+esc(IRepairDB.label(j.status))+'</span><div class="price">'+money(j.price)+'</div></div></div><div class="tags"><span class="tag">'+esc(j.repair)+'</span><span class="tag">'+esc(j.service)+'</span>'+(j.postcode?'<span class="tag">'+esc(j.postcode)+'</span>':'')+(j.slot?'<span class="tag">'+esc(j.slot)+'</span>':'')+'<span class="tag '+(['in_stock','fitted'].includes(j.partState)?'good':j.partState==='not_checked'?'':'warn')+'">Part: '+esc(IRepairDB.partLabel(j.partState))+'</span><span class="tag '+(j.paymentState==='paid'?'good':'due')+'">'+esc(IRepairDB.paymentLabel(j.paymentState))+'</span></div><div class="actions"><button class="btn secondary" data-open="'+esc(j.id)+'">'+(selected===j.id?'Close':'Open job')+'</button><button class="btn" data-next="'+esc(j.id)+'">Next status →</button></div>'+detail(j)+'</article>'}
function jobsView(){const jobs=visible();return hero()+'<div class="toolbar"><button class="btn" id="syncNow">Sync Core</button><button class="btn secondary" id="newDemo">+ Demo booking</button></div><div class="filters">'+[['all','All'],['action','Needs action'],['parts','Parts'],['done','Completed']].map(f=>'<button class="filter '+(filter===f[0]?'active':'')+'" data-filter="'+f[0]+'">'+f[1]+'</button>').join('')+'</div><div class="section"><h3>Job queue</h3><span>'+jobs.length+' shown</span></div>'+(jobs.length?jobs.map(card).join(''):'<div class="empty">No repairs in this view.</div>')}
function routeView(){const jobs=IRepairDB.listJobs().filter(j=>!['completed','cancelled'].includes(j.status)&&/mobile/i.test(j.service)).sort((a,b)=>String(a.slot||'').localeCompare(String(b.slot||'')));return hero()+'<div class="section"><h3>Today’s mobile route</h3><span>'+jobs.length+' stops</span></div>'+(jobs.length?jobs.map((j,i)=>{const loc=[j.address,j.postcode].filter(Boolean).join(', ');return '<div class="route"><div class="route-row"><div><span class="route-num">'+(i+1)+'</span><b>'+esc(j.customerName)+'</b></div><span class="status '+esc(j.status)+'">'+esc(IRepairDB.label(j.status))+'</span></div><div class="muted" style="margin:8px 0">'+esc(j.device)+' · '+esc(j.repair)+'<br>'+esc(j.slot||'Time TBC')+' · '+esc(loc||'Location TBC')+'</div>'+(loc?'<a href="https://maps.apple.com/?q='+encodeURIComponent(loc)+'" target="_blank">Open navigation →</a>':'')+'</div>'}).join(''):'<div class="empty">No active mobile jobs.</div>')}
function customersView(){const map={};IRepairDB.listJobs().forEach(j=>{const k=j.customerName||'Unknown';if(!map[k])map[k]={name:k,jobs:0,devices:new Set(),spent:0};map[k].jobs++;map[k].devices.add(j.device);if(j.status==='completed'&&typeof j.price==='number')map[k].spent+=j.price});const arr=Object.values(map);return hero()+'<div class="section"><h3>Demo customers</h3><span>'+arr.length+' records</span></div>'+(arr.length?arr.map(c=>'<div class="customer"><b>'+esc(c.name)+'</b><div class="muted">'+c.jobs+' repair'+(c.jobs===1?'':'s')+' · '+c.devices.size+' device'+(c.devices.size===1?'':'s')+' · completed spend '+money(c.spent)+'</div></div>').join(''):'<div class="empty">No customer records yet.</div>')}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));$('#main').innerHTML=view==='route'?routeView():view==='customers'?customersView():jobsView();bind();coreChip()}
function bind(){document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;selected=null;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=selected===b.dataset.open?null:b.dataset.open;render()});document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{const j=IRepairDB.getJob(b.dataset.next);if(j){IRepairDB.setStatus(j.id,nextStatus(j),'technician');selected=j.id;render()}});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{IRepairDB.setStatus(selected,b.dataset.status,'technician');render()});document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{IRepairDB.setPartState(selected,b.dataset.part,'technician');render()});document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{IRepairDB.setPaymentState(selected,b.dataset.pay,'technician');render()});document.querySelectorAll('[data-partinfo]').forEach(b=>b.onclick=()=>{IRepairDB.updateJob(b.dataset.partinfo,{partName:$('#partName').value.trim(),supplier:$('#supplier').value.trim()},'technician');render()});document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{const t=$('#noteText');if(t&&t.value.trim()){IRepairDB.addNote(b.dataset.note,t.value,'Technician','technician');render()}});document.querySelectorAll('[data-customer]').forEach(b=>b.onclick=()=>{const t=$('#customerMessage');if(t&&t.value.trim()){IRepairDB.setCustomerMessage(b.dataset.customer,t.value,'technician');render()}});const sy=$('#syncNow');if(sy)sy.onclick=()=>IRepairDB.syncRemote().then(render);const nd=$('#newDemo');if(nd)nd.onclick=()=>{const j=IRepairDB.createDemoBooking();selected=j.id;render()}}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;selected=null;render()});IRepairDB.subscribe(render);IRepairDB.subscribeConnection(render);render();
})();
</script>
</body></html>
