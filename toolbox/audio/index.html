athe{50%{transform:scaleY(.4)}}.footer{position:fixed;bottom:0;left:0;right:0;z-index:3;display:flex;justify-content:center;border-top:1px solid var(--line);background:#111b2aee;backdrop-filter:blur(18px);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px)}.footer-inner{display:flex;width:min(510px,100%);justify-content:space-around}.navbtn{border:0;background:none;color:#879cb5;font-size:11px;display:grid;place-items:center;gap:5px;min-width:70px;padding:2px 4px}.navbtn i{font-size:21px;font-style:normal}.navbtn.active{color:var(--mint)}.sectiontop{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:13px}.textlink{border:0;background:none;color:#94bff8;font-size:12px}.feature{display:flex;align-items:center;gap:12px;margin:14px 0}.feature .icon{flex-shrink:0}#notice{margin-top:8px}.hidden{display:none}.count{font-size:33px;letter-spacing:-1px;font-weight:800;color:var(--mint)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<script>
(function(){
"use strict";
var app=document.getElementById("app");
var tab="home",index=0,results={},chosen="iPhone (model unknown)",ready=false;
var ctx=null,tone=null,recoveryTimer=null,recoveryTick=null,stream=null,analyser=null,raf=0,recorder=null,recordChunks=[],recordUrl="",meterActive=false;
var devices=["iPhone (model unknown)","iPhone 16 Pro","iPhone 16 Pro Max","iPhone 15 Pro","iPhone 15 Pro Max","iPhone 14 Pro","iPhone 14 Pro Max","iPhone 13 Pro","Other iPhone"];
var tests=[
{id:"receiver",name:"Receiver / earpiece",type:"native",side:"front",focus:"top",note:"The iOS app will request the receiver audio route. Safari cannot reliably select the receiver independently.",instruction:"The native test will play a spoken sample through the earpiece."},
{id:"speaker",name:"Default speaker output",type:"speaker",side:"front",focus:"bottom",note:"Sound plays through the browser's current output route. This does not isolate individual stereo speakers.",instruction:"Play the tone. Listen for distortion, crackles or unusually low volume."},
{id:"mic",name:"Default microphone recording",type:"mic",side:"front",focus:"bottom",note:"Safari selects the input. This test cannot prove which physical microphone was used.",instruction:"Allow microphone access, speak clearly, then record and play back a short sample."},
{id:"front",name:"Front microphone source",type:"native",side:"front",focus:"top",note:"Independent front microphone selection requires native iOS device testing.",instruction:"This component will be highlighted and tested in the iPhone app, where supported."},
{id:"rear",name:"Rear microphone source",type:"native",side:"back",focus:"top",note:"Independent rear microphone selection requires native iOS device testing.",instruction:"This component will be highlighted and tested in the iPhone app, where supported."},
{id:"lower",name:"Additional lower microphone(s)",type:"native",side:"front",focus:"bottom",note:"Physical lower microphones may be paired/processed by iOS. The app must never claim to isolate an inaccessible capsule.",instruction:"Individual capsule results are not available in this browser preview."}
];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function frame(side,focus){return '<div class="phone-view"><div class="phone '+(side==="back"?"back ":"")+(focus==="top"?"zoom-top":"zoom-bottom")+'"><div class="island"></div><div class="cameras"><i></i><i></i><i></i></div><div class="slit"></div><span class="dot '+(side==="back"?"rear":focus==='top'?"top":"bottom")+'"></span></div><span class="view-label">'+(side==="back"?"Rear":"Front")+' · '+(focus==="top"?"Upper":"Lower")+' component</span></div>'}
function label(t){return '<span class="pill '+(t==="PASS"?"pass":t==="FAIL"?"fail":"unable")+'">'+esc(t||"NOT TESTED")+'</span>'}
function buttons(){return '<div class="two"><button class="btn good" id="pass"'+(!ready?" disabled":"")+'>✓ Pass</button><button class="btn bad" id="fail"'+(!ready?" disabled":"")+'>✕ Fail</button></div><button class="btn secondary full" id="unable" style="margin-top:9px">Unable to test</button>'}
function detected(){return /iPhone/i.test(navigator.userAgent)?"iPhone browser detected. Exact model detection requires the native iOS app.":"Browser preview: exact iPhone model detection requires a native iOS app."}
function home(){app.innerHTML='<div class="eyebrow">Meet your audio health check</div><h1>Hear the<br><span style="color:var(--mint)">difference.</span></h1><p>Guided speaker and microphone checks, component close-ups, and a clean report you can share with a repair technician.</p><div class="panel"><div class="sectiontop"><h3>YOUR DEVICE</h3><span class="pill">Manual selection</span></div><div class="status">'+detected()+'</div><select class="select" id="device" aria-label="Choose iPhone model">'+devices.map(function(d){return '<option '+(d===chosen?"selected":"")+'>'+esc(d)+'</option>'}).join("")+'</select><div class="tiny muted" style="margin-top:10px">In the native app, the hardware identifier will be matched to a verified model catalogue.</div></div><div class="panel"><div class="feature"><div class="icon">◉</div><div class="grow"><h3>Audio diagnostic</h3><div class="small muted">6 guided stages · microphone meter and playback</div></div></div><button class="btn full" id="start">Start diagnostic →</button></div><div class="two"><div class="panel" style="margin:0"><div class="icon">≈</div><h3 style="margin-top:12px">Speaker recovery</h3><div class="small muted">Controlled tone sweep</div><button class="textlink" id="recoverylink" style="padding:9px 0">Explore →</button></div><div class="panel" style="margin:0"><div class="icon">⌘</div><h3 style="margin-top:12px">Hardware map</h3><div class="small muted">Model-dependent locations</div><button class="textlink" id="maplink" style="padding:9px 0">Explore →</button></div></div><p class="tiny" style="margin-top:17px">Web preview: audio routes and physical microphone selection are more restricted than in the App Store version.</p>';document.getElementById("device").onchange=function(e){chosen=e.target.value};document.getElementById("start").onclick=function(){index=0;results={};ready=false;go("tests")};document.getElementById("recoverylink").onclick=function(){go("recovery")};document.getElementById("maplink").onclick=function(){go("map")}}
function testsView(){if(index>=tests.length){summary();return}var t=tests[index];ready=false;var s='<div class="sectiontop"><div class="eyebrow">Guided diagnostic</div><span class="number">TEST '+(index+1)+' OF '+tests.length+'</span></div><div class="progress">'+tests.map(function(x,i){return '<span class="'+(i<index?"done":"")+'"></span>'}).join("")+'</div><h2>'+esc(t.name)+'</h2><p>'+esc(t.instruction)+'</p>'+frame(t.side,t.focus)+'<div class="status">'+esc(t.note)+'</div>';
if(t.type==="speaker"){s+='<div class="panel"><h3>Play output tone</h3><p class="small">Use a comfortable volume. The test uses the browser default audio output.</p><button class="btn full" id="play">▶ Play test tone</button><button class="btn secondary full hidden" id="stopTone" style="margin-top:8px">Stop audio</button></div>'+buttons()}
else if(t.type==="mic"){s+='<div class="panel"><div class="sectiontop"><h3>Live microphone level</h3><span id="db" class="small muted">— dBFS</span></div><div class="meter"><div id="meter"></div></div><button class="btn full" id="micstart">Allow microphone</button><div id="microps" class="hidden"><div class="two" style="margin-top:9px"><button class="btn secondary" id="recstart">● Record sample</button><button class="btn secondary" id="recstop" disabled>■ Stop recording</button></div><audio id="playback" controls class="hidden" style="width:100%;margin-top:12px" aria-label="Play microphone recording"></audio></div><div class="small muted" id="micnotice" style="margin-top:9px">No recording is uploaded. Microphone audio stays in this browser session.</div></div>'+buttons()}
else{s+='<div class="caution">Native iOS testing required. This stage cannot be marked Pass or Fail from a web browser.</div><button class="btn full" id="unable">Mark unavailable and continue →</button>'}
s+='<button class="btn ghost full" id="back" style="margin-top:10px">← Previous step</button>';app.innerHTML=s;var back=document.getElementById("back");back.onclick=function(){if(index>0){stopMedia();index--;testsView()}else go("home")};
if(t.type==="native"){document.getElementById("unable").onclick=function(){mark("UNABLE")};return}
document.getElementById("unable").onclick=function(){mark("UNABLE")};document.getElementById("pass").onclick=function(){mark("PASS")};document.getElementById("fail").onclick=function(){mark("FAIL")};
if(t.type==="speaker"){document.getElementById("play").onclick=async function(){try{await playTone();ready=true;document.getElementById("pass").disabled=false;document.getElementById("fail").disabled=false;document.getElementById("stopTone").classList.remove("hidden")}catch(e){alert("Audio could not start: "+e.message)}};document.getElementById("stopTone").onclick=stopTone}
if(t.type==="mic"){document.getElementById("micstart").onclick=startMic;document.getElementById("recstart").onclick=startRecord;document.getElementById("recstop").onclick=stopRecord}
}
function mark(value){results[tests[index].id]=value;stopMedia();index++;testsView()}
function stopTone(){if(tone){try{tone.stop()}catch(e){}tone=null}if(recoveryTimer){clearTimeout(recoveryTimer);recoveryTimer=null}if(recoveryTick){clearInterval(recoveryTick);recoveryTick=null}}
async function context(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")await ctx.resume();return ctx}
async function playTone(){stopTone();var c=await context(),osc=c.createOscillator(),gain=c.createGain();osc.type="sine";osc.frequency.setValueAtTime(450,c.currentTime);osc.frequency.linearRampToValueAtTime(750,c.currentTime+0.4);gain.gain.setValueAtTime(.0001,c.currentTime);gain.gain.linearRampToValueAtTime(.09,c.currentTime+.1);gain.gain.setValueAtTime(.09,c.currentTime+1.3);gain.gain.linearRampToValueAtTime(.0001,c.currentTime+1.55);osc.connect(gain);gain.connect(c.destination);tone=osc;osc.onended=function(){if(tone===osc)tone=null};osc.start();osc.stop(c.currentTime+1.6)}
async function startMic(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){document.getElementById("micnotice").textContent="This browser does not support microphone capture.";return}
try{stopMicrophone();stream=await navigator.mediaDevices.getUserMedia({audio:true});var c=await context(),source=c.createMediaStreamSource(stream);analyser=c.createAnalyser();analyser.fftSize=2048;source.connect(analyser);meterActive=true;ready=true;document.getElementById("pass").disabled=false;document.getElementById("fail").disabled=false;document.getElementById("micstart").textContent="Microphone active";document.getElementById("micstart").disabled=true;document.getElementById("microps").classList.remove("hidden");document.getElementById("micnotice").textContent="Microphone enabled. dBFS is a digital recording level, not calibrated sound-pressure dB.";updateMeter()}catch(e){document.getElementById("micnotice").textContent="Microphone access unavailable: "+e.message}}
function updateMeter(){if(!analyser||!meterActive)return;var a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);var sum=0;for(var i=0;i<a.length;i++)sum+=a[i]*a[i];var rms=Math.sqrt(sum/a.length),db=rms>0?Math.max(-90,20*Math.log10(rms)):-90;var dbel=document.getElementById("db"),mbel=document.getElementById("meter");if(dbel)dbel.textContent=db.toFixed(0)+" dBFS";if(mbel)mbel.style.width=Math.max(0,Math.min(100,(db+65)/65*100))+"%";raf=requestAnimationFrame(updateMeter)}
function startRecord(){if(!stream||!window.MediaRecorder){document.getElementById("micnotice").textContent="Recording is not supported in this browser. Live level metering is still available.";return}recordChunks=[];try{recorder=new MediaRecorder(stream);recorder.ondataavailable=function(e){if(e.data.size)recordChunks.push(e.data)};recorder.onstop=function(){if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=URL.createObjectURL(new Blob(recordChunks,{type:recorder.mimeType||"audio/mp4"}));var a=document.getElementById("playback");if(a){a.src=recordUrl;a.classList.remove("hidden")}};recorder.start();document.getElementById("recstart").disabled=true;document.getElementById("recstop").disabled=false;document.getElementById("micnotice").textContent="Recording locally. Tap Stop when finished."}catch(e){document.getElementById("micnotice").textContent=e.message}}
function stopRecord(){if(recorder&&recorder.state==="recording")recorder.stop();var a=document.getElementById("recstart"),b=document.getElementById("recstop");if(a)a.disabled=false;if(b)b.disabled=true;var n=document.getElementById("micnotice");if(n)n.textContent="Play your recording, then select Pass or Fail."}
function stopMicrophone(){meterActive=false;cancelAnimationFrame(raf);if(recorder&&recorder.state==="recording")try{recorder.stop()}catch(e){}if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}analyser=null;if(recordUrl){URL.revokeObjectURL(recordUrl);recordUrl=""}}
function stopMedia(){stopTone();stopMicrophone()}
function reportText(){return ["iREPAIR AUDIO DIAGNOSTICS","WEB PREVIEW — USER-REPORTED RESULTS, NOT CERTIFIED HARDWARE TEST","Model: "+chosen+" (manually selected)","Date: "+new Date().toLocaleString("en-GB"),"","RESULTS"].concat(tests.map(function(t){return t.name+": "+(results[t.id]||"NOT TESTED")})).concat(["","Browser audio output/microphone sources are not individually mapped.","No conclusion on physical capsule functionality can be drawn from unavailable tests.","iRepair Toolbox"]).join("\n")}
function summary(){var pass=0,fail=0,unable=0;tests.forEach(function(t){if(results[t.id]==="PASS")pass++;else if(results[t.id]==="FAIL")fail++;else unable++});app.innerHTML='<div class="eyebrow">Diagnostic complete</div><h1>Your results<span style="color:var(--mint)">.</span></h1><p>These results reflect your guided browser checks, not a certified physical component assessment.</p><div class="two"><div class="panel" style="margin:0"><div class="count">'+pass+'</div><div class="small muted">Passed</div></div><div class="panel" style="margin:0"><div class="count" style="color:var(--red)">'+fail+'</div><div class="small muted">Failed</div></div></div><div class="panel"><div class="sectiontop"><h3>Individual tests</h3><span class="small muted">'+unable+' unavailable</span></div><div class="results">'+tests.map(function(t){return '<div class="result"><span>'+esc(t.name)+'</span>'+label(results[t.id])+'</div>'}).join("")+'</div></div><div class="caution">Browser checks cannot confirm which physical microphone or stereo speaker was used. Unavailable tests have not been counted as failures.</div><button class="btn full" id="copy">▣ Copy diagnostic report</button><div id="notice" class="small muted" role="status"></div><button class="btn secondary full" id="again" style="margin-top:12px">↻ Start a new test</button>';document.getElementById("copy").onclick=async function(){try{await navigator.clipboard.writeText(reportText());document.getElementById("notice").textContent="Report copied to clipboard."}catch(e){var ta=document.createElement("textarea");ta.value=reportText();document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");ta.remove();document.getElementById("notice").textContent=ok?"Report copied to clipboard.":"Clipboard unavailable; try a secure browser."}};document.getElementById("again").onclick=function(){index=0;results={};go("tests")}}
function recovery(){app.innerHTML='<div class="eyebrow">Speaker care</div><h1>Speaker<br><span style="color:var(--mint)">recovery.</span></h1><p>A short, controlled low-frequency tone sweep designed to help shift moisture near the speaker opening. Results are not guaranteed.</p><div class="panel" style="text-align:center"><div class="icon" style="margin:4px auto 20px;width:75px;height:75px;font-size:37px">≈</div><div class="count" id="clock">8s</div><div class="wave" aria-hidden="true">'+[24,37,19,44,32,18,41,28,35,20,43,29,17,38].map(function(h){return '<i style="height:'+h+'px"></i>'}).join("")+'</div><p class="small" style="margin-top:16px">Gentle variable-frequency pulse · 8 seconds</p><button class="btn full" id="recover">▶ Start recovery tone</button><button class="btn secondary full hidden" id="halt" style="margin-top:10px">■ Stop immediately</button><div id="recStatus" class="small muted" role="status" style="margin-top:12px">Use a comfortable volume and hold the speaker away from your ears.</div></div><div class="caution">Audio cannot reliably remove grease, compacted dirt or corrosion. Do not charge a wet phone. If liquid may have entered the device, follow Apple\'s drying guidance and seek professional help if needed.</div><button class="btn ghost full" id="posttest">Run a post-recovery audio test →</button>';document.getElementById("recover").onclick=runRecovery;document.getElementById("halt").onclick=function(){stopTone();document.getElementById("recStatus").textContent="Recovery stopped.";document.getElementById("recover").disabled=false;document.getElementById("halt").classList.add("hidden")};document.getElementById("posttest").onclick=function(){stopMedia();index=0;results={};go("tests")}}
async function runRecovery(){stopTone();try{var c=await context(),o=c.createOscillator(),g=c.createGain(),now=c.currentTime;o.type="sine";o.frequency.setValueAtTime(160,now);for(var j=1;j<=16;j++)o.frequency.linearRampToValueAtTime(j%2?205:130,now+j*.5);g.gain.setValueAtTime(.0001,now);g.gain.linearRampToValueAtTime(.10,now+.35);g.gain.setValueAtTime(.10,now+7.5);g.gain.linearRampToValueAtTime(.0001,now+8);o.connect(g);g.connect(c.destination);tone=o;o.start(now);o.stop(now+8.05);document.getElementById("recover").disabled=true;document.getElementById("halt").classList.remove("hidden");document.getElementById("recStatus").textContent="Recovery tone running on the browser default output.";var end=Date.now()+8000;recoveryTick=setInterval(function(){var sec=Math.max(0,Math.ceil((end-Date.now())/1000));var el=document.getElementById("clock");if(el)el.textContent=sec+"s"},200);recoveryTimer=setTimeout(function(){stopTone();var st=document.getElementById("recStatus"),btn=document.getElementById("recover"),halt=document.getElementById("halt");if(st)st.textContent="Cycle complete. You can compare results with a fresh diagnostic.";if(btn)btn.disabled=false;if(halt)halt.classList.add("hidden")},8100)}catch(e){document.getElementById("recStatus").textContent="Audio unavailable: "+e.message}}
function map(){var detailed=chosen==="iPhone 16 Pro"||chosen==="iPhone 16 Pro Max";app.innerHTML='<div class="eyebrow">Hardware intelligence</div><h1>Know your<br><span style="color:var(--mint)">components.</span></h1><p>Exact physical microphone mapping varies by iPhone generation. Illustrations are for navigation and must be verified against official service documentation.</p><div class="panel"><h3>Choose a model</h3><select class="select" id="mapDevice">'+devices.map(function(d){return '<option '+(d===chosen?"selected":"")+'>'+esc(d)+'</option>'}).join("")+'</select><div class="status" style="margin-top:12px">'+(detailed?"iPhone 16 Pro family: four physical microphones documented; front, rear, and two lower microphones.":"Exact physical microphone count and placement for this selection still require model-specific verification.")+'</div></div>'+frame("front","top")+'<div class="panel"><div class="result"><span>Front microphone area</span>'+label(detailed?"DOCUMENTED":"ILLUSTRATIVE")+'</div><div class="result" style="margin-top:8px"><span>Rear microphone area</span>'+label(detailed?"DOCUMENTED":"ILLUSTRATIVE")+'</div><div class="result" style="margin-top:8px"><span>Lower microphones</span>'+label(detailed?"TWO DOCUMENTED":"UNVERIFIED")+'</div><div class="tiny muted" style="margin-top:14px">A physical microphone location is not proof that iOS exposes an independent input for it.</div></div>';document.getElementById("mapDevice").onchange=function(e){chosen=e.target.value;map()}}
function go(next){stopMedia();tab=next;document.querySelectorAll(".navbtn").forEach(function(el){el.classList.toggle("active",el.dataset.tab===tab)});if(tab==="home")home();else if(tab==="tests")testsView();else if(tab==="recovery")recovery();else map();window.scrollTo({top:0,behavior:"instant"})}
document.querySelectorAll(".navbtn").forEach(function(el){el.onclick=function(){go(el.dataset.tab)}});document.addEventListener("visibilitychange",function(){if(document.hidden)stopMedia()});window.addEventListener("pagehide",stopMedia);home()
})();
</script>
</body>
</html>
