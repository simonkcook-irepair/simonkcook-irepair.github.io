<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2034"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="iRepair Relay">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=11"><title>iRepair Repair Relay</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#ecf7ff;background:#071421}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 12% 0,#173c61 0,transparent 34%),linear-gradient(160deg,#071421,#0b2034 60%,#0d2a45)}button,textarea{font:inherit}.app{max-width:500px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:39px;height:52px;object-fit:contain}.brand h1{margin:0;font-size:19px}.brand small{display:block;color:#88a8c5;font-size:10px}.limited{padding:7px 9px;border-radius:99px;border:1px solid #4c779b;background:#102c44;color:#cfe9ff;font-size:9px;font-weight:900;letter-spacing:.04em}.intro,.card{background:linear-gradient(145deg,#102a41,#0b1e31);border:1px solid #2c506d;border-radius:22px;box-shadow:0 12px 34px #0004;padding:16px;margin:10px 0}.intro{border-color:#4b7596}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.1em;color:#7da5c7}.intro h2{font-size:24px;line-height:1.1;margin:6px 0}.muted{font-size:10px;color:#8caec8;line-height:1.55}.notice{margin-top:10px;padding:10px 11px;border-radius:14px;background:#081724;border:1px solid #274963;color:#a9c9df;font-size:10px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.mini{padding:10px 8px;border-radius:14px;background:#081724;border:1px solid #294861;min-height:72px}.mini strong{display:block;color:#7e9db7;font-size:8px;margin-bottom:5px}.mini span{font-size:11px;font-weight:850}.status{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:99px;background:#143550;border:1px solid #386281;font-size:11px;font-weight:900;margin-top:9px}.status.completed{background:#123a2d;border-color:#3f7b5e;color:#c9f2d9}.status.on_my_way,.status.arrived,.status.repairing{background:#123d62;border-color:#3979a9;color:#d7eeff}.status.waiting_part{background:#493818;border-color:#765c27;color:#ffe4aa}.progress{height:9px;background:#081724;border:1px solid #23445f;border-radius:99px;overflow:hidden;margin-top:11px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#58b5ff,#1f78cf);border-radius:99px}.msg{padding:10px 12px;border-radius:15px;background:#102a41;border:1px solid #294f6b;margin:7px 0;font-size:11px;line-height:1.45}.msg.tech{background:#164f79;border-color:#327eae}.msg b{display:block;font-size:9px;margin-bottom:3px}.msg small{display:block;color:#8eb0c8;margin-top:4px;font-size:8px}.obs{padding:10px 12px;border-radius:14px;background:#3d3119;border:1px solid #725d2d;margin:7px 0;font-size:10px;color:#f1dbab}.field{width:100%;min-height:78px;border:1px solid #315775;border-radius:14px;background:#071522;padding:11px;color:#eef8ff;resize:vertical}.btn{width:100%;border:0;border-radius:15px;min-height:46px;padding:10px 13px;background:linear-gradient(135deg,#5aafff,#0b71d7);color:white;font-weight:900;margin-top:8px}.btn.secondary{background:#112b43;color:#c7e4f9;border:1px solid #315775}.complete{padding:14px;border-radius:17px;background:#123a2d;border:1px solid #3f7b5e;color:#cef4dc}.error{padding:18px;border-radius:18px;background:#421f29;border:1px solid #754153;color:#ffc8d7}.spinner{text-align:center;padding:50px 10px;color:#88aac5}.footer{text-align:center;padding:12px 20px;color:#678ba8;font-size:9px;line-height:1.5}.lock{font-size:24px;display:block;margin-bottom:6px}
</style></head>
<body><main class="app"><div class="top"><div class="brand"><img src="/apple-touch-icon.png?v=11" alt="iRepair"><div><h1>Repair Relay</h1><small>Temporary repair communication</small></div></div><span class="limited">LIMITED ACCESS</span></div><div id="root" class="spinner">Connecting to the repair…</div></main>
<script>
(function(){
const API='https://psswyljihufyxiieqziu.supabase.co/functions/v1/growth-api';
const KEY='sb_publishable_oRtVKV3yejg4521iPjNeDg_YWxa088L';
const token=new URLSearchParams(location.search).get('t')||'';let current=null,timer=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,options){const o=Object.assign({method:'GET',headers:{}},options||{});o.headers=Object.assign({'Accept':'application/json','Authorization':'Bearer '+KEY,'apikey':KEY},o.headers||{});if(o.body&&typeof o.body!=='string'){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}const r=await fetch(API+path,o);const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(e){}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
function label(s){return ({booked:'Booked',confirmed:'Booking confirmed',on_my_way:'Technician on the way',arrived:'Technician arrived',repairing:'Repair underway',waiting_part:'Waiting for part',completed:'Repair complete',cancelled:'Cancelled'})[s]||s}
function progress(s){return ({booked:12,confirmed:25,on_my_way:42,arrived:55,repairing:72,waiting_part:60,completed:100,cancelled:0})[s]||10}
function render(){const r=document.getElementById('root');if(!current){r.innerHTML='<div class="error">This Repair Relay link is unavailable.</div>';return}const j=current.job,relay=current.relay,obs=current.observations||[],msgs=current.messages||[],done=j.status==='completed';r.className='';r.innerHTML='<section class="intro"><div class="eyebrow">THIS IS NOT THE FULL iREPAIR APP</div><h2>You’re following one repair only.</h2><div class="muted">'+(relay.displayName?esc(relay.displayName)+', this ':'This ')+'temporary Relay lets you see progress and message iRepair while the customer’s device is unavailable.</div><div class="notice"><span class="lock">🔒</span><strong>Limited access:</strong> no prices, profile, other repairs, marketing settings or technician-only notes are available here.</div></section><section class="card"><div class="eyebrow">REPAIR · '+esc(j.id)+'</div><h2 style="margin:6px 0 3px">'+esc(j.device)+'</h2><div class="muted">'+esc(j.repair)+'<br>'+esc(j.service)+(j.slot?' · '+esc(j.slot):'')+'</div><div class="status '+esc(j.status)+'">'+(done?'✓ ':'')+esc(label(j.status))+'</div><div class="progress"><i style="width:'+progress(j.status)+'%"></i></div><div class="grid"><div class="mini"><strong>REPAIR</strong><span>'+esc(label(j.status))+'</span></div><div class="mini"><strong>MESSAGES</strong><span>'+msgs.length+'</span></div><div class="mini"><strong>ACCESS</strong><span>Temporary</span></div></div></section>'+(done?'<section class="card"><div class="complete"><strong>🔔 Repair complete</strong><br>The temporary Relay has done its job. You can now hand the device back or arrange collection with the customer.</div><div class="muted" style="margin-top:10px">If you liked how this worked, you can open the full iRepair app for your own devices.</div><button class="btn" id="fullApp">Open full iRepair app</button><button class="btn secondary" id="shareApp">Recommend iRepair to someone</button></section>':'')+(obs.length?'<section class="card"><div class="eyebrow">CUSTOMER-VISIBLE OBSERVATIONS</div>'+obs.map(o=>'<div class="obs"><b>'+esc(o.category.replaceAll('_',' '))+'</b><br>'+esc(o.note)+(o.customer_advised?'<br><small>Customer advised ✓</small>':'')+'</div>').join('')+'</section>':'')+'<section class="card"><div class="eyebrow">REPAIR CHAT</div><div class="muted">Messages here are attached only to this repair.</div><div style="margin-top:8px">'+(msgs.length?msgs.slice(-12).map(m=>'<div class="msg '+(m.senderRole==='technician'?'tech':'')+'"><b>'+esc(m.senderName||m.senderRole)+'</b>'+esc(m.body)+'<small>'+new Date(m.at).toLocaleString('en-GB')+'</small></div>').join(''):'<div class="muted" style="padding:10px 0">No messages yet.</div>')+'</div>'+(relay.canChat?'<textarea class="field" id="reply" placeholder="Message iRepair…"></textarea><button class="btn" id="send">Send repair message</button>':'')+'</section><div class="footer">Repair Relay expires automatically and is only for this repair. Opening it does not create an iRepair account or subscribe you to marketing.</div>';
 if(document.getElementById('send'))document.getElementById('send').onclick=send;
 if(document.getElementById('fullApp'))document.getElementById('fullApp').onclick=()=>location.href='/?src=relay-complete';
 if(document.getElementById('shareApp'))document.getElementById('shareApp').onclick=async()=>{const url='https://simonkcook-irepair.github.io/?src=relay-share';if(navigator.share)await navigator.share({title:'iRepair',text:'If you ever need help with your device, here is iRepair.',url});else location.href=url};
}
async function load(){if(!token){current=null;render();return}try{current=await api('/relay/'+encodeURIComponent(token));render()}catch(e){document.getElementById('root').className='';document.getElementById('root').innerHTML='<div class="error"><strong>Repair Relay unavailable</strong><br>'+esc(e.message)+'</div>';if(timer)clearInterval(timer)}}
async function send(){const box=document.getElementById('reply'),text=(box&&box.value||'').trim();if(!text)return;const b=document.getElementById('send');b.disabled=true;b.textContent='Sending…';try{current=await api('/relay/'+encodeURIComponent(token)+'/messages',{method:'POST',body:{text}});box.value='';render()}catch(e){b.disabled=false;b.textContent='Send repair message'}}
load();timer=setInterval(()=>{if(document.visibilityState!=='hidden')load()},5000);
})();
</script><script src="/relay-trip36.js?v=37"></script></body></html>
