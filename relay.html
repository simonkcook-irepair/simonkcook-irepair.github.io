<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dcecff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="iRepair Relay">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=11"><title>iRepair Repair Relay</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17324a;background:#d9e9f8}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(160deg,#edf7ff,#cfe3f6)}button,textarea{font:inherit}.app{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.head img{width:48px;height:64px;object-fit:contain}.head h1{margin:0;font-size:22px}.head small{color:#64839f}.card{background:#ffffffd9;border:1px solid #b9d2e8;border-radius:22px;box-shadow:0 14px 34px #46749d22;padding:16px;margin:10px 0;backdrop-filter:blur(14px)}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.08em;color:#6688a4}.status{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:99px;background:#e9f2fb;border:1px solid #c4d8ea;font-size:11px;font-weight:900;margin-top:8px}.status.completed{background:#ddf6e7;border-color:#9fd0b4;color:#256844}.status.on_my_way,.status.arrived,.status.repairing{background:#e2f0ff;border-color:#a8caeb;color:#145d9d}.status.waiting_part{background:#fff4d9;border-color:#e7c980;color:#76530c}.meta{font-size:12px;line-height:1.55;color:#5f7b92}.step{height:8px;background:#dbe8f2;border-radius:99px;overflow:hidden;margin-top:10px}.step i{display:block;height:100%;background:#2b83d5;border-radius:99px}.msg{padding:10px 12px;border-radius:15px;background:#edf3f8;margin:7px 0;font-size:12px;line-height:1.45}.msg.tech{background:#dcefff}.msg b{display:block;font-size:10px;margin-bottom:2px}.msg small{display:block;color:#7690a4;margin-top:4px;font-size:9px}.obs{padding:10px 12px;border-radius:14px;background:#fff8e7;border:1px solid #ead7a4;margin:7px 0;font-size:11px}.field{width:100%;min-height:78px;border:1px solid #b7cfe3;border-radius:14px;background:white;padding:11px;color:#17324a;resize:vertical}.btn{width:100%;border:0;border-radius:15px;min-height:46px;padding:10px 13px;background:linear-gradient(135deg,#5aafff,#0b71d7);color:white;font-weight:900;margin-top:8px}.btn.secondary{background:#edf5fc;color:#27618f;border:1px solid #b8d2e8}.complete{padding:14px;border-radius:17px;background:#ddf6e7;border:1px solid #9fd0b4;color:#285f43}.muted{font-size:10px;color:#7893a8;line-height:1.5}.error{padding:18px;border-radius:18px;background:#fff2f2;border:1px solid #e3b8b8;color:#8c3535}.spinner{text-align:center;padding:40px;color:#65849e}
</style></head>
<body><main class="app"><div class="head"><img src="/apple-touch-icon.png?v=11" alt="iRepair"><div><h1>Repair Relay</h1><small>Temporary repair updates from iRepair</small></div></div><div id="root" class="spinner">Connecting to iRepair Core…</div></main>
<script>
(function(){
const API='https://psswyljihufyxiieqziu.supabase.co/functions/v1/growth-api';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzc3d5bGppaHVmeXhpaWVxeml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0OTc5MTgsImV4cCI6MjEwNjA3MzkxOH0.LdUk-Qf7eielTK8iu0PpbCHNRi9sm6QO7PyPQ7j-zEU';
const token=new URLSearchParams(location.search).get('t')||'';let current=null,timer=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,options){const o=Object.assign({method:'GET',headers:{}},options||{});o.headers=Object.assign({'Accept':'application/json','Authorization':'Bearer '+KEY,'apikey':KEY},o.headers||{});if(o.body&&typeof o.body!=='string'){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}const r=await fetch(API+path,o);const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(e){}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
function label(s){return ({booked:'Booked',confirmed:'Booking confirmed',on_my_way:'Technician on the way',arrived:'Technician arrived',repairing:'Repair underway',waiting_part:'Waiting for part',completed:'Repair complete',cancelled:'Cancelled'})[s]||s}
function progress(s){return ({booked:12,confirmed:25,on_my_way:42,arrived:55,repairing:72,waiting_part:60,completed:100,cancelled:0})[s]||10}
function render(){const r=document.getElementById('root');if(!current){r.innerHTML='<div class="error">This Repair Relay link is unavailable.</div>';return}const j=current.job,relay=current.relay,obs=current.observations||[],msgs=current.messages||[],done=j.status==='completed';r.className='';r.innerHTML='<section class="card"><div class="eyebrow">REPAIR RELAY · '+esc(j.id)+'</div><h2 style="margin:5px 0 4px">'+esc(j.device)+'</h2><div class="meta">'+esc(j.repair)+'<br>'+esc(j.service)+(j.slot?' · '+esc(j.slot):'')+'</div><div class="status '+esc(j.status)+'">'+(done?'✓ ':'')+esc(label(j.status))+'</div><div class="step"><i style="width:'+progress(j.status)+'%"></i></div></section>'+(done?'<section class="card"><div class="complete"><strong>Repair complete ✓</strong><br>This relay has done its job. If you ever need help with your own phone, you can open the full iRepair app below.</div><button class="btn" id="fullApp">Open full iRepair app</button><button class="btn secondary" id="shareApp">Share iRepair with someone else</button></section>':'')+(obs.length?'<section class="card"><div class="eyebrow">TECHNICIAN OBSERVATIONS</div>'+obs.map(o=>'<div class="obs"><b>'+esc(o.category.replaceAll('_',' '))+'</b><br>'+esc(o.note)+(o.customer_advised?'<br><small>Customer advised ✓</small>':'')+'</div>').join('')+'</section>':'')+'<section class="card"><div class="eyebrow">REPAIR CHAT</div><div class="muted">This conversation is linked only to this repair.</div><div style="margin-top:8px">'+(msgs.length?msgs.slice(-12).map(m=>'<div class="msg '+(m.senderRole==='technician'?'tech':'')+'"><b>'+esc(m.senderName||m.senderRole)+'</b>'+esc(m.body)+'<small>'+new Date(m.at).toLocaleString('en-GB')+'</small></div>').join(''):'<div class="muted" style="padding:10px 0">No messages yet.</div>')+'</div>'+(relay.canChat?'<textarea class="field" id="reply" placeholder="Message Simon at iRepair…"></textarea><button class="btn" id="send">Send message</button>':'')+'</section><div class="muted" style="text-align:center;padding:8px">Repair Relay is temporary and only shows information needed for this repair. It does not sign you up to marketing.</div>';
 if(document.getElementById('send'))document.getElementById('send').onclick=send;
 if(document.getElementById('fullApp'))document.getElementById('fullApp').onclick=()=>location.href='/?src=relay-complete';
 if(document.getElementById('shareApp'))document.getElementById('shareApp').onclick=async()=>{const url='https://simonkcook-irepair.github.io/?src=relay-share';if(navigator.share)await navigator.share({title:'iRepair',text:'If you ever need help with your phone, here is iRepair.',url});else location.href=url};
}
async function load(){if(!token){current=null;render();return}try{current=await api('/relay/'+encodeURIComponent(token));render()}catch(e){document.getElementById('root').className='';document.getElementById('root').innerHTML='<div class="error"><strong>Repair Relay unavailable</strong><br>'+esc(e.message)+'</div>';if(timer)clearInterval(timer)}}
async function send(){const box=document.getElementById('reply'),text=(box&&box.value||'').trim();if(!text)return;const b=document.getElementById('send');b.disabled=true;b.textContent='Sending…';try{current=await api('/relay/'+encodeURIComponent(token)+'/messages',{method:'POST',body:{text}});box.value='';render()}catch(e){b.disabled=false;b.textContent='Send message'}}
load();timer=setInterval(()=>{if(document.visibilityState!=='hidden')load()},5000);
})();
</script></body></html>
