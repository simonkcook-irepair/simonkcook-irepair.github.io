name: iRepair Core API Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/core-api-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://psswyljihufyxiieqziu.supabase.co/functions/v1/core-api
      ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzc3d5bGppaHVmeXhpaWVxeml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0OTc5MTgsImV4cCI6MjEwNjA3MzkxOH0.LdUk-Qf7eielTK8iu0PpbCHNRi9sm6QO7PyPQ7j-zEU
    steps:
      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $ANON" -H "apikey: $ANON")
          echo "Testing $BASE/health"
          code=$(curl -sS -o /tmp/health.txt -w '%{http_code}' "${auth[@]}" "$BASE/health")
          echo "HTTP $code"
          cat /tmp/health.txt
          test "$code" = "200"

      - name: Create synthetic repair job
        shell: bash
        run: |
          set -euo pipefail
          payload='{"customerName":"GitHub Smoke Test","device":"iPhone 13 · TEST ONLY","deviceConfidence":"confirmed","repair":"Screen replacement diagnostic","price":99,"service":"Mobile call-out","address":"Swansea TEST ONLY","postcode":"SA2","status":"booked","compatibility":"universal","partState":"not_checked","paymentState":"unpaid","priority":"normal","source":"smoke-test"}'
          code=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST "$BASE/jobs" -H "Authorization: Bearer $ANON" -H "apikey: $ANON" -H 'Content-Type: application/json' --data "$payload")
          echo "HTTP $code"
          cat /tmp/create.json
          test "$code" = "200" -o "$code" = "201"
          id=$(jq -r '.job.id // .id // empty' /tmp/create.json)
          test -n "$id"
          echo "JOB_ID=$id" >> "$GITHUB_ENV"

      - name: Read job
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/read.json -w '%{http_code}' -H "Authorization: Bearer $ANON" -H "apikey: $ANON" "$BASE/jobs/$JOB_ID")
          echo "HTTP $code"
          cat /tmp/read.json
          test "$code" = "200"

      - name: Update workflow fields
        shell: bash
        run: |
          set -euo pipefail
          call(){
            label="$1"; path="$2"; body="$3"
            echo "--- $label"
            code=$(curl -sS -o /tmp/step.json -w '%{http_code}' -X POST "$BASE/jobs/$JOB_ID/$path" -H "Authorization: Bearer $ANON" -H "apikey: $ANON" -H 'Content-Type: application/json' --data "$body")
            echo "HTTP $code"
            cat /tmp/step.json
            test "$code" = "200" -o "$code" = "201"
          }
          call status status '{"status":"confirmed","actor":"Smoke Test"}'
          call part part-state '{"partState":"in_stock","actor":"Smoke Test"}'
          call payment payment-state '{"paymentState":"paid","actor":"Smoke Test"}'
          call priority priority '{"priority":"high","actor":"Smoke Test"}'
          call note notes '{"text":"Synthetic internal note from GitHub Actions","author":"Smoke Test"}'
          call customer-update customer-updates '{"text":"Synthetic customer-visible update from GitHub Actions","author":"Smoke Test"}'

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/final.json -w '%{http_code}' -H "Authorization: Bearer $ANON" -H "apikey: $ANON" "$BASE/jobs/$JOB_ID")
          echo "HTTP $code"
          cat /tmp/final.json
          test "$code" = "200"
          jq -e '(.job.status == "confirmed") and (.job.partState == "in_stock") and (.job.paymentState == "paid") and (.job.priority == "high")' /tmp/final.json >/dev/null
          echo "FULL HANDSHAKE PASSED"
