name: iRepair Build 28 Glass Visual Smoke Test
on:
  push:
    paths:
      - 'build28.js'
      - 'index.html'
      - 'assets/bg28-*.js'
      - '.github/workflows/build28-glass-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Build 28 JavaScript syntax
        run: node --check build28.js

      - name: Verify Build 28r4 is wired into the app
        run: |
          grep -Eq 'core.html\?v=[0-9]+' index.html
          grep -q "build28.js?v=28r4" index.html
          for i in 0 1 2 3 4 5 6; do
            grep -q "assets/bg28-$i.js?v=28r4" index.html
          done
          grep -q -- "--irepair-bg" build28.js
          grep -q "URL.createObjectURL" build28.js
          grep -q "backdrop-filter:blur" build28.js
          grep -q ".app:before" build28.js
          grep -q "b26-hero{display:none" build28.js

      - name: Reassemble and validate high-resolution WebP
        run: |
          python3 - <<'PY'
          import base64, pathlib, re, struct
          chunks=[]
          for i in range(7):
              text=pathlib.Path(f'assets/bg28-{i}.js').read_text()
              m=re.search(r"\+'([^']*)';\s*$", text)
              if not m:
                  raise SystemExit(f'Could not parse bg28-{i}.js')
              chunks.append(m.group(1))
          encoded=''.join(chunks)
          data=base64.b64decode(encoded, validate=True)
          assert data[:4] == b'RIFF', data[:12]
          assert data[8:12] == b'WEBP', data[:12]
          declared=struct.unpack('<I', data[4:8])[0] + 8
          assert declared == len(data), (declared, len(data))
          assert len(data) > 30000, len(data)
          print(f'Build 28r4 artwork valid: {len(data):,} bytes, RIFF/WEBP length exact')
          PY

      - name: Verify public Build 28r4 files after Pages catches up
        run: |
          set -e
          BASE="https://simonkcook-irepair.github.io"
          for n in $(seq 1 18); do
            HTML="$(curl -fsSL "$BASE/?build=28r4-check-$n" || true)"
            JS="$(curl -fsSL "$BASE/build28.js?v=28r4-check-$n" || true)"
            if echo "$HTML" | grep -q "build28.js?v=28r4" && echo "$HTML" | grep -Eq 'core.html\?v=[0-9]+' && echo "$JS" | grep -q -- "--irepair-bg"; then
              echo "Live Build 28r4 detected"
              exit 0
            fi
            echo "Pages not updated yet ($n/18); waiting 10s"
            sleep 10
          done
          echo "Build 28r4 was not visible on GitHub Pages within the smoke window"
          exit 1
