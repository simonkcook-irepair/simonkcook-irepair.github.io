name: iRepair Exact Model Catalogue and Customer Flow

on:
  push:
    paths:
      - 'data/device-catalogue.*'
      - 'device-catalogue.js'
      - 'build30.js'
      - 'build24.js'
      - 'index.html'
      - 'tests/**'
      - 'scripts/build-catalogue.cjs'
      - '.github/workflows/build30-catalogue-smoke.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Check JavaScript and generated catalogue
        run: |
          node --check build24.js
          node --check build30.js
          node --check device-catalogue.js
          node scripts/build-catalogue.cjs
          git diff --exit-code -- data/device-catalogue.js
      - name: Install pinned test dependencies
        run: npm ci --prefix tests --no-audit --no-fund
      - name: Verify catalogue and full existing customer module chain
        run: npm test --prefix tests
