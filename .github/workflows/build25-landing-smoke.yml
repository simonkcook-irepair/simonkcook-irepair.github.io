name: iRepair Build 25 Landing Smoke Test
on:
  push:
    paths:
      - 'build25.js'
      - 'index.html'
      - '.github/workflows/build25-landing-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Build 25 JavaScript syntax
        run: node --check build25.js
      - name: Verify final progressive customer journey
        run: |
          grep -Eq "build25\.js\?v=25r[0-9]+" index.html
          grep -q "How can I help?" build25.js
          grep -q "I know what I need — show me prices" build25.js
          grep -q "I need help — I’m not sure what I need" build25.js
          grep -q "Recommend iRepair" build25.js
          grep -q "Repair Relay" build25.js
          grep -q "shareIRepair25" build25.js
          grep -q "openRelay25" build25.js
          grep -q "Which device needs attention?" build25.js
          grep -q "Select everything that needs attention" build24.js
          grep -q "Repair not within your budget?" build25.js
          grep -q "sellCard=function(){return ''}" build25.js
          grep -Eq "build16\.js\?v=23r2.*build24\.js\?v=24.*build25\.js\?v=25r[0-9]+" index.html
