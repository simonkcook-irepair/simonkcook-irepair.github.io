<script>
'use strict';
// Entirely local demonstration: no fetch, API calls, personal data upload, live stock or real booking.
const CATALOGUE={
 'iphone13':{name:'iPhone 13',screen:{LCD:99,OLED:149},battery:79,rear:99},
 'iphone13pro':{name:'iPhone 13 Pro',screen:{LCD:99,OLED:149},rear:99},
 'iphone14pm':{name:'iPhone 14 Pro Max',screen:{LCD:109,OLED:149},rear:99},
 'iphone15plus':{name:'iPhone 15 Plus',screen:{LCD:99,OLED:149},rear:99},
 'iphone15pro':{name:'iPhone 15 Pro',screen:{LCD:109,OLED:159},rear:99,review:true},
 'iphone15pm':{name:'iPhone 15 Pro Max',screen:{LCD:109,OLED:159},battery:79,rear:99,review:true},
 'otherphone':{name:'Other phone / model',screen:{}},
 'tablet':{name:'Tablet / iPad',screen:{},office:true}
};
const FAULTS=[{id:'screen',label:'Screen damage',icon:'▣',office:false},{id:'battery',label:'Battery issue',icon:'▤',office:false},{id:'charging',label:'Problems charging',icon:'⚡',office:true},{id:'power',label:"Won't switch on",icon:'⏻',office:true},{id:'audio',label:'Quiet / muffled audio',icon:'◖))',office:true},{id:'camera',label:'Camera problem',icon:'◉',office:true},{id:'rear',label:'Rear glass / cosmetic',icon:'◫',office:true},{id:'liquid',label:'Liquid damage',icon:'≈',office:true},{id:'other',label:'Other problem',icon:'···',office:true}];
const $=q=>document.querySelector(q);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let stage=1,mode='home',active=1,nextDevice=2,nextRepair=1,devices=[{id:1,model:'iphone13',custom:''}],basket=[],fault='',variant='',editId=null,diagnostic={wiggle:'',cables:'',audio:[],colour:'',notes:''},service='',place='Home',postcode='',date='',daypart='',sellCondition='',helpStep=1,helpKnown='',helpUsable='',helpBrand='',helpCameras='',helpDisplay='',helpPort='',helpIssue='';
const getDevice=id=>devices.find(d=>d.id===id),selected=()=>getDevice(active),modelFor=d=>CATALOGUE[d.model]||CATALOGUE.otherphone,displayModel=d=>d.model==='otherphone'?(d.custom.trim()||'Other phone / model'):modelFor(d).name;
const gbp=n=>n===null||n===undefined?'Quote required':'£'+n.toFixed(0);
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,3400)}
function resetDiagnostic(){variant='';diagnostic={wiggle:'',cables:'',audio:[],colour:'',notes:''}}
function setStage(n){if(n===2&&!basket.length){toast('Please add at least one repair first.');return}stage=n;mode='book';render();window.scrollTo({top:0,behavior:'instant'})}
function addDevice(){devices.push({id:nextDevice++,model:'iphone13',custom:''});active=devices[devices.length-1].id;fault='';editId=null;resetDiagnostic();stage=1;render();toast('Second device added. Choose its model and repairs.')}
function setDevice(id){active=id;fault='';editId=null;resetDiagnostic();render()}
function setModel(v){let d=selected();if(basket.some(r=>r.deviceId===d.id)){toast('Remove repairs for this device before changing its model.');render();return}d.model=v;d.custom='';fault='';resetDiagnostic();render()}
function pickFault(id){fault=id;editId=null;resetDiagnostic();render();document.getElementById('faultDetail')?.scrollIntoView({block:'nearest',behavior:'smooth'})}
function buildOptions(){let m=modelFor(selected());if(fault==='screen'){return [['LCD',m.screen.LCD??null,'Lower cost; may use more battery.'],['OLED',m.screen.OLED??null,'Closer to the original display, smoother and more responsive for fast texters.']]}if(fault==='battery')return [['Battery replacement',m.battery??null,'Confirm model, diagnosis and stock before appointment.']];if(fault==='charging')return [['Microscope cleaning',40,'£40, normally 30 minutes, only if cleaning is appropriate; current-draw test included.'],['Charging-port diagnosis',null,'Full port replacement quoted separately. Cleaning and replacement are alternatives, not cumulative charges.']];if(fault==='power')return [['Power / no-power diagnosis',null,'We will test charging, battery response and power behaviour before quoting a repair.']];if(fault==='audio')return [['Audio diagnosis',null,'Check speaker grille, earpiece or microphone before quoting.']];if(fault==='camera')return [['Camera diagnosis',null,'We will confirm whether the camera, lens, focus or another component is causing the problem.']];if(fault==='rear')return [['Rear-glass replacement',m.rear??null,'Killay office, normally 1–2 hours. Confirm colour, stock and price before booking.']];if(fault==='liquid')return [['Liquid-damage assessment',null,'Killay office assessment; price depends on findings.']];return [['Custom diagnosis',null,'We will confirm the fault, repairability and price.']]}
function priceFor(r){return r.price===null?'Quote required':r.conditional?gbp(r.price)+' if appropriate':r.review?gbp(r.price)+' · review pending':gbp(r.price)}
function isOffice(r){return r.fault!=='screen'&&r.fault!=='battery'||modelFor(getDevice(r.deviceId)).office===true||getDevice(r.deviceId).model==='otherphone'}
function route(){return basket.length&&basket.every(r=>!isOffice(r))?'both':'dropin'}
function addRepair(){if(!selected().model||!fault||!variant){toast('Choose a device, fault and repair option first.');return}if(selected().model==='otherphone'&&!selected().custom.trim()){toast('Enter the phone model first.');return}if(fault==='rear'&&!diagnostic.colour){toast('Choose the rear-glass colour first.');return}if(fault==='charging'&&(!diagnostic.wiggle||!diagnostic.cables)){toast('Please answer both charging questions.');return}if(fault==='audio'&&!diagnostic.audio.length){toast('Please select at least one audio symptom.');return}
let existing=basket.find(r=>r.deviceId===active&&r.fault===fault&&r.id!==editId);if(existing){toast('This fault is already in the basket for this device. Use Edit to change it.');return}
let option=buildOptions().find(o=>o[0]===variant),m=modelFor(selected());if(!option)return;
const r={id:editId??nextRepair++,deviceId:active,model:displayModel(selected()),fault,faultLabel:FAULTS.find(f=>f.id===fault).label,option:variant,price:option[1],conditional:fault==='charging'&&variant==='Microscope cleaning',review:!!m.review&&fault==='screen',diagnostic:JSON.parse(JSON.stringify(diagnostic))};
if(editId){basket=basket.map(item=>item.id===editId?r:item)}else basket.push(r);
const edited=!!editId;fault='';editId=null;resetDiagnostic();render();toast(edited?'Repair updated.':'Repair added. Add another repair or continue.')}
function removeRepair(id){basket=basket.filter(r=>r.id!==id);if(editId===id){editId=null;fault='';resetDiagnostic()}service='';stage=1;render();toast('Repair removed.')}

function diagnosticFields(){if(fault==='charging')return `<label class="field-label">Do you wiggle, angle, wedge or hold the cable?</label><div class="pill-row">${['Yes','No','Not sure'].map(v=>`<button class="pill" type="button" data-diagnostic="wiggle" data-value="${v}" aria-pressed="${diagnostic.wiggle===v}">${v}</button>`).join('')}</div><label class="field-label">Have you tried different cables and plugs?</label><div class="pill-row">${['Yes','No','Not sure'].map(v=>`<button class="pill" type="button" data-diagnostic="cables" data-value="${v}" aria-pressed="${diagnostic.cables===v}">${v}</button>`).join('')}</div><p class="helper">A loose-feeling connector can be compacted debris, but inspection is needed. The £40 service is conditional.</p>`;

’ll check the service area before offering a real appointment. Please don't enter your actual address here.</p>`:''}<div class="divider"></div><label class="field-label" for="preferredDate">Preferred date (not a live appointment)</label><input type="date" class="field" id="preferredDate" value="${safe(date)}" min="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}"><label class="field-label" for="daypart">Preferred time</label><select class="field" id="daypart"><option value="">Choose a time preference</option>${['Morning','Afternoon','Either'].map(v=>`<option value="${v}" ${daypart===v?'selected':''}>${v}</option>`).join('')}</select><div class="warning">No live appointment slots are checked. Selecting a date here does not create or confirm a booking.</div><div class="button-row"><button type="button" class="btn secondary" data-action="back-repairs">← Repairs</button><button type="button" class="btn" data-action="next-review" ${!service||!date||!daypart?'disabled':''}>Review request →</button></div></section>`}

function helpIssueScreen(){let issueCards=[['screen','▣','Screen / display','Cracked glass, lines, black display or touch problem'],['battery','▤','Battery','Draining quickly, shutting down or battery warning'],['charging','⚡','Charging','Cable connection, slow/no charging or loose-feeling port'],['power','⏻',"Won’t switch on",'No response, boot problem or powers off'],['audio','◖))','Sound','Quiet, muffled, crackling, speaker or microphone'],['camera','◉','Camera','Focus, shaking, black image, lens or camera fault'],['rear','◫','Back glass / cosmetic','Rear glass damage or cosmetic damage'],['liquid','≈','Liquid damage','Water or liquid exposure'],['other','···','Something else','None of these describe it']];return `<section class="glass panel">${helpProgress()}<div class="eyebrow">STEP 2 · WHAT’S HAPPENING?</div><h2>Which sounds closest?</h2><p class="muted">You don’t need to know the repair name. Pick the symptom and we’ll take you to the most likely repair path.</p><div class="route-choice">${issueCards.map(i=>`<button class="route-card ${helpIssue===i[0]?'primary':''}" data-help-issue="${i[0]}"><strong>${i[1]} ${safe(i[2])}</strong><small>${safe(i[3])}</small></button>`).join('')}</div>${helpIssue?`<div class="tip">We’ll open the <strong>${safe(FAULTS.find(f=>f.id===helpIssue)?.label||'diagnostic')}</strong> route next. You can change it or add another problem before booking.</div><button class="btn" data-action="help-show-options">Show me the repair options →</button>`:''}<button class="btn ghost help-back" data-action="help-device-back">← Back to device</button></section>`}

});
document.addEventListener('change',e=>{let x=e.target;if(x.id==='helpModel'){setModel(x.value);helpKnown='yes'}else if(x.id==='helpCustomModel'){selected().custom=x.value;render()}else if(x.id==='model'){setModel(x.value)}else if(x.id==='customModel'){selected().custom=x.value}else if(x.id==='glassColour'){diagnostic.colour=x.value;render()}else if(x.dataset.audio){let label=x.dataset.audio;diagnostic.audio=x.checked?[...new Set([...diagnostic.audio,label])]:diagnostic.audio.filter(v=>v!==label)}else if(x.id==='preferredDate'){date=x.value;render()}else if(x.id==='daypart'){daypart=x.value;render()}else if(x.id==='sellDevice'){active=Number(x.value);render()}});
document.addEventListener('input',e=>{if(e.target.id==='helpCustomModel'){selected().custom=e.target.value;const next=document.querySelector('[data-action=help-device-next]');if(next)next.disabled=!e.target.value.trim();}if(e.target.id==='customModel')selected().custom=e.target.value;if(e.target.id==='postcode')postcode=e.target.value;if(e.target.id==='otherNotes')diagnostic.notes=e.target.value});
render();
</script></body></html>
