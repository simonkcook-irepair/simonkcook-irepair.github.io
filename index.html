<body>
<iframe id="irepair-app" src="core.html?v=32r2" title="iRepair" allow="camera; geolocation"></iframe>
<script>
(function(){
 const f=document.getElementById('irepair-app');
 f.addEventListener('load',function(){
   const d=f.contentDocument,w=f.contentWindow;
   if(!d||!w)return;
   ['build09.css?v=09','build10.css?v=10','build11.css?v=11r2','build13.css?v=13'].forEach(function(href){
     const link=d.createElement('link');
     link.rel='stylesheet'; link.href=href;
     d.head.appendChild(link);
   });
   const files=[
     'build09-part1.js?v=09','build09-part2.js?v=09','build09-part3.js?v=09','build09-part4.js?v=09',
     'build10.js?v=10','build11.js?v=11r2','build12.js?v=12r2','build13.js?v=13','build14.js?v=14','build15.js?v=15',
     'prototype-db.js?v=22','build16.js?v=23r2','build24.js?v=24c31r3','build25.js?v=25r4','build26.js?v=26','build27.js?v=27',
     'assets/bg28-0.js?v=28r4','assets/bg28-1.js?v=28r4','assets/bg28-2.js?v=28r4','assets/bg28-3.js?v=28r4','assets/bg28-4.js?v=28r4','assets/bg28-5.js?v=28r4','assets/bg28-6.js?v=28r4',
     'build28.js?v=28r4','build29.js?v=29b','data/device-catalogue.js?v=31r3','device-catalogue.js?v=31r3','build30.js?v=31r3','build32.js?v=32','build36.js?v=36','build37.js?v=37','customer-account49.js?v=49'
   ];
   let i=0;
   function unavailable(){
     d.body.innerHTML='<main class="app"><section class="glass panel"><h2>Device options are unavailable</h2><p>Please reload the app to try again.</p></section></main>';
     f.style.visibility='visible';
   }
   function next(){
     if(i>=files.length){
       if(!w.IRepairCatalogueReady){unavailable();return;}
       try{w.render();f.style.visibility='visible';}catch(e){console.error(e);unavailable();}
       return;
     }
     const s=d.createElement('script');
     s.src=files[i++]; s.async=false; s.onload=next;
     s.onerror=function(){console.error('iRepair module failed:',s.src);unavailable()};
     d.body.appendChild(s);
   }
   next();
 });
})();
</script>
<script src="/native-notifications48.js?v=48"></script>
</body>
</html>
