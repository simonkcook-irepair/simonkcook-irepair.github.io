<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dbeafa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="iRepair">
<meta name="application-name" content="iRepair">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=11">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=11">
<link rel="manifest" href="/site.webmanifest?v=11">
<title>iRepair</title>
<link rel="stylesheet" href="build10.css?v=10">
<link rel="stylesheet" href="build11.css?v=11r2">
<link rel="stylesheet" href="build13.css?v=13">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d6e5f7}
#irepair-app{display:block;width:100%;height:100dvh;border:0;background:#d6e5f7}
</style>
</head>
<body>
<iframe id="irepair-app" src="core.html?v=13" title="iRepair" allow="camera"></iframe>
<script>
(function(){
 const f=document.getElementById('irepair-app');
 f.addEventListener('load',function(){
   const d=f.contentDocument,w=f.contentWindow;
   if(!d||!w)return;
   ['build09.css?v=09','build10.css?v=10','build11.css?v=11r2','build13.css?v=13'].forEach(function(href){
     const link=d.createElement('link');
     link.rel='stylesheet'; link.href=href;
     d.head.appendChild(link);
   });
   const files=['build09-part1.js?v=09','build09-part2.js?v=09','build09-part3.js?v=09','build09-part4.js?v=09','build10.js?v=10','build11.js?v=11r2','build12.js?v=12','build13.js?v=13'];
   let i=0;
   function next(){
     if(i>=files.length){
       try{w.render();}catch(e){console.error(e)}
       return;
     }
     const s=d.createElement('script');
     s.src=files[i++]; s.async=false; s.onload=next;
     s.onerror=function(){console.error('iRepair module failed:',s.src);next()};
     d.body.appendChild(s);
   }
   next();
 });
})();
</script>
</body>
</html>
